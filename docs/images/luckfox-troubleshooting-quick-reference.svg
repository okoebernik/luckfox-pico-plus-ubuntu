<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu troubleshooting quick reference</title>
  <desc id="desc">Troubleshooting quick reference showing observe, identify layer, collect evidence, analyze, recover, verify and document.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="observe" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="identify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="collect" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="analyze" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="recover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="document" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
  </defs>

  <rect width="1400" height="540" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Troubleshooting Quick Reference</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">A repeatable method for every failure</text>

  <g filter="url(#shadow)">
    <rect x="35" y="180" width="150" height="150" rx="22" fill="url(#observe)"/>
    <text x="110" y="220" text-anchor="middle" class="box-title">Observe</text>
    <text x="110" y="252" text-anchor="middle" class="box-sub">Exact symptom</text>
    <text x="110" y="279" text-anchor="middle" class="box-sub">Do not guess</text>
  </g>
  <path d="M185 255 H230" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="230" y="180" width="150" height="150" rx="22" fill="url(#identify)"/>
    <text x="305" y="220" text-anchor="middle" class="box-title">Identify</text>
    <text x="305" y="252" text-anchor="middle" class="box-sub">Failure layer</text>
    <text x="305" y="279" text-anchor="middle" class="box-sub">Highest working stage</text>
  </g>
  <path d="M380 255 H425" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="425" y="180" width="150" height="150" rx="22" fill="url(#collect)"/>
    <text x="500" y="220" text-anchor="middle" class="box-title">Collect</text>
    <text x="500" y="252" text-anchor="middle" class="box-sub">UART · dmesg</text>
    <text x="500" y="279" text-anchor="middle" class="box-sub">journal · state</text>
  </g>
  <path d="M575 255 H620" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="620" y="180" width="150" height="150" rx="22" fill="url(#analyze)"/>
    <text x="695" y="220" text-anchor="middle" class="box-title">Analyze</text>
    <text x="695" y="252" text-anchor="middle" class="box-sub">Compare evidence</text>
    <text x="695" y="279" text-anchor="middle" class="box-sub">Choose one cause</text>
  </g>
  <path d="M770 255 H815" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="815" y="180" width="150" height="150" rx="22" fill="url(#recover)"/>
    <text x="890" y="220" text-anchor="middle" class="box-title">Recover</text>
    <text x="890" y="252" text-anchor="middle" class="box-sub">One controlled fix</text>
    <text x="890" y="279" text-anchor="middle" class="box-sub">Keep rollback ready</text>
  </g>
  <path d="M965 255 H1010" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1010" y="180" width="150" height="150" rx="22" fill="url(#verify)"/>
    <text x="1085" y="220" text-anchor="middle" class="box-title">Verify</text>
    <text x="1085" y="252" text-anchor="middle" class="box-sub">Reboot · retest</text>
    <text x="1085" y="279" text-anchor="middle" class="box-sub">Check all layers</text>
  </g>
  <path d="M1160 255 H1205" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1205" y="180" width="150" height="150" rx="22" fill="url(#document)"/>
    <text x="1280" y="220" text-anchor="middle" class="box-title">Document</text>
    <text x="1280" y="252" text-anchor="middle" class="box-sub">Root cause</text>
    <text x="1280" y="279" text-anchor="middle" class="box-sub">Fix and evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="185" y="390" width="1030" height="76" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="225" y="420" class="note">Core evidence:</text>
    <text x="225" y="447" class="mono">UART log · dmesg · journalctl -b · free -h · swapon --show · ip address · lsblk</text>
  </g>

  <text x="700" y="505" text-anchor="middle" class="note">Preserve evidence before rebooting or reflashing.</text>
</svg>