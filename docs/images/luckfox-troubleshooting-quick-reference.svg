<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  <linearGradient id="u" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="k" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  <linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
</defs>
<rect width="1400" height="540" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Troubleshooting Quick Reference</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Verify each layer in sequence</text>

<g filter="url(#shadow)">
 <rect x="45" y="180" width="170" height="150" rx="22" fill="url(#p)"/>
 <text x="130" y="222" text-anchor="middle" class="box-title">Power</text>
 <text x="130" y="253" text-anchor="middle" class="box-sub">LEDs · supply</text>
 <text x="130" y="280" text-anchor="middle" class="box-sub">Board stable</text>
</g>
<path d="M215 255 H260" class="connector"/>

<g filter="url(#shadow)">
 <rect x="260" y="180" width="170" height="150" rx="22" fill="url(#u)"/>
 <text x="345" y="222" text-anchor="middle" class="box-title">UART</text>
 <text x="345" y="253" text-anchor="middle" class="box-sub">115200 8N1</text>
 <text x="345" y="280" text-anchor="middle" class="box-sub">Boot log visible</text>
</g>
<path d="M430 255 H475" class="connector"/>

<g filter="url(#shadow)">
 <rect x="475" y="180" width="170" height="150" rx="22" fill="url(#k)"/>
 <text x="560" y="222" text-anchor="middle" class="box-title">Kernel</text>
 <text x="560" y="253" text-anchor="middle" class="box-sub">Starts and mounts</text>
 <text x="560" y="280" text-anchor="middle" class="box-sub">No panic</text>
</g>
<path d="M645 255 H690" class="connector"/>

<g filter="url(#shadow)">
 <rect x="690" y="180" width="170" height="150" rx="22" fill="url(#h)"/>
 <text x="775" y="222" text-anchor="middle" class="box-title">Userspace</text>
 <text x="775" y="253" text-anchor="middle" class="box-sub">systemd · swap</text>
 <text x="775" y="280" text-anchor="middle" class="box-sub">Login prompt</text>
</g>
<path d="M860 255 H905" class="connector"/>

<g filter="url(#shadow)">
 <rect x="905" y="180" width="170" height="150" rx="22" fill="url(#n)"/>
 <text x="990" y="222" text-anchor="middle" class="box-title">Network</text>
 <text x="990" y="253" text-anchor="middle" class="box-sub">Link · DHCP</text>
 <text x="990" y="280" text-anchor="middle" class="box-sub">Default route</text>
</g>
<path d="M1075 255 H1120" class="connector"/>

<g filter="url(#shadow)">
 <rect x="1120" y="180" width="170" height="150" rx="22" fill="url(#s)"/>
 <text x="1205" y="222" text-anchor="middle" class="box-title">SSH</text>
 <text x="1205" y="253" text-anchor="middle" class="box-sub">Port 22 · auth</text>
 <text x="1205" y="280" text-anchor="middle" class="box-sub">Stable shell</text>
</g>

<g filter="url(#shadow)">
  <rect x="155" y="395" width="1090" height="72" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="195" y="424" class="note">Core commands:</text>
  <text x="195" y="451" class="mono">free -h · swapon --show · ip address · ip route · ss -ltn · systemctl --failed · dmesg</text>
</g>
</svg>