<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Ubuntu root filesystem image generation</title>
  <desc id="desc">Shows how the Ubuntu root filesystem is created, optimized, enriched with Luckfox kernel modules, packed into ext4, and finalized with a swap file.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="config" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="image" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  </defs>

  <rect width="1400" height="850" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Ubuntu RootFS Image Generation</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">How the project creates a bootable, low-memory-optimized rootfs.img</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="75" y="160" width="260" height="130" rx="22" fill="url(#source)"/>
    <text x="205" y="203" text-anchor="middle" class="box-title">debootstrap</text>
    <text x="205" y="234" text-anchor="middle" class="box-sub">Ubuntu 22.04 · ARMHF</text>
    <text x="205" y="260" text-anchor="middle" class="box-sub">Minimal userspace</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="75" y="345" width="260" height="130" rx="22" fill="url(#config)"/>
    <text x="205" y="388" text-anchor="middle" class="box-title">Project Configuration</text>
    <text x="205" y="419" text-anchor="middle" class="box-sub">users · SSH · network · fstab</text>
    <text x="205" y="445" text-anchor="middle" class="box-sub">systemd and memory tuning</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="75" y="530" width="260" height="130" rx="22" fill="url(#module)"/>
    <text x="205" y="573" text-anchor="middle" class="box-title">Luckfox Kernel Modules</text>
    <text x="205" y="604" text-anchor="middle" class="box-sub">29 modules · Linux 5.10.160</text>
    <text x="205" y="630" text-anchor="middle" class="box-sub">depmod metadata</text>
  </g>

  <!-- merge -->
  <path d="M335 225 H415 V340" class="connector-soft"/>
  <path d="M335 410 H415" class="connector-soft"/>
  <path d="M335 595 H415 V480" class="connector-soft"/>

  <g filter="url(#shadow)">
    <rect x="415" y="280" width="320" height="260" rx="28" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="575" y="325" text-anchor="middle" class="label">Working Root Filesystem</text>

    <rect x="460" y="355" width="230" height="42" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="575" y="381" text-anchor="middle" class="mono">rootfs/ubuntu-jammy/</text>

    <text x="465" y="431" class="note">• Ubuntu packages and user accounts</text>
    <text x="465" y="459" class="note">• Luckfox kernel modules</text>
    <text x="465" y="487" class="note">• SSH and Ethernet configuration</text>
    <text x="465" y="515" class="note">• Reduced timers and volatile journal</text>
  </g>

  <path d="M735 410 H795" class="connector"/>

  <!-- Image creation -->
  <g filter="url(#shadow)">
    <rect x="795" y="225" width="275" height="370" rx="28" fill="url(#image)"/>
    <text x="932" y="272" text-anchor="middle" class="box-title">Create ext4 Image</text>

    <rect x="840" y="305" width="185" height="44" rx="12" fill="rgba(255,255,255,.15)"/>
    <text x="932" y="332" text-anchor="middle" class="box-sub">truncate 1536M</text>

    <path d="M932 350 V377" class="connector-soft"/>

    <rect x="840" y="385" width="185" height="44" rx="12" fill="rgba(255,255,255,.15)"/>
    <text x="932" y="412" text-anchor="middle" class="box-sub">mkfs.ext4 -d</text>

    <path d="M932 430 V457" class="connector-soft"/>

    <rect x="840" y="465" width="185" height="44" rx="12" fill="rgba(255,255,255,.15)"/>
    <text x="932" y="492" text-anchor="middle" class="box-sub">add 512 MB swapfile</text>

    <path d="M932 510 V537" class="connector-soft"/>

    <rect x="840" y="545" width="185" height="44" rx="12" fill="rgba(255,255,255,.15)"/>
    <text x="932" y="572" text-anchor="middle" class="box-sub">e2fsck verification</text>
  </g>

  <path d="M1070 410 H1130" class="connector"/>

  <!-- Final image -->
  <g filter="url(#shadow)">
    <rect x="1130" y="300" width="210" height="220" rx="28" fill="url(#verify)"/>
    <text x="1235" y="346" text-anchor="middle" class="box-title">rootfs.img</text>
    <text x="1235" y="382" text-anchor="middle" class="box-sub">ext4 filesystem</text>
    <text x="1235" y="410" text-anchor="middle" class="box-sub">Ubuntu 22.04</text>
    <text x="1235" y="438" text-anchor="middle" class="box-sub">kernel modules</text>
    <text x="1235" y="466" text-anchor="middle" class="box-sub">swap enabled</text>
    <text x="1235" y="494" text-anchor="middle" class="box-sub">ready for packaging</text>
  </g>

  <!-- Validation checklist -->
  <g filter="url(#shadow)">
    <rect x="430" y="650" width="865" height="115" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="465" y="687" class="label">Validation before release</text>
    <text x="465" y="716" class="note">✓ /etc/os-release reports Ubuntu 22.04</text>
    <text x="465" y="742" class="note">✓ /etc/fstab points to mmcblk1p6 and enables /swapfile</text>
    <text x="860" y="716" class="note">✓ modules.dep matches Linux 5.10.160</text>
    <text x="860" y="742" class="note">✓ e2fsck completes without errors</text>
  </g>

  <text x="700" y="812" text-anchor="middle" class="note">The working root filesystem stays outside Git; only reproducible scripts and configuration are versioned.</text>
</svg>