<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2f7"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".14"/></filter>
 <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748b"/></marker>
 <style>
 .t{font:700 36px Inter,Segoe UI,Arial;fill:#0f172a}.st{font:400 17px Inter,Segoe UI,Arial;fill:#475569}
 .bt{font:700 20px Inter,Segoe UI,Arial;fill:#fff}.bs{font:400 13px Inter,Segoe UI,Arial;fill:#fff}
 .n{font:500 13px Inter,Segoe UI,Arial;fill:#64748b}.m{font:600 13px monospace;fill:#334155}
 .c{fill:none;stroke:#64748b;stroke-width:4;stroke-linecap:round;marker-end:url(#a)}
 </style>
</defs>
<rect width="1500" height="860" rx="30" fill="url(#bg)"/><text x="750" y="58" text-anchor="middle" class="t">Development Milestones</text><text x="750" y="88" text-anchor="middle" class="st">Each milestone combines engineering work, validation and documentation</text><g filter="url(#s)"><rect x="70" y="145" width="650" height="245" rx="24" fill="#059669"/><text x="395.0" y="190" text-anchor="middle" class="bt">Milestone 1 · Reliable Foundation</text><text x="110" y="237" class="bs">✓ Bootable Ubuntu 22.04 image</text><text x="110" y="268" class="bs">✓ Ethernet, SSH and active swap</text><text x="110" y="299" class="bs">✓ Reproducible release pipeline</text><text x="110" y="330" class="bs">✓ Recovery documentation</text></g><g filter="url(#s)"><rect x="780" y="145" width="650" height="245" rx="24" fill="#2563eb"/><text x="1105.0" y="190" text-anchor="middle" class="bt">Milestone 2 · Build Quality</text><text x="820" y="237" class="bs">• Validate host and SDK automatically</text><text x="820" y="268" class="bs">• Improve logs and failure messages</text><text x="820" y="299" class="bs">• Automate filesystem expansion</text><text x="820" y="330" class="bs">• Add release consistency checks</text></g><g filter="url(#s)"><rect x="70" y="455" width="650" height="245" rx="24" fill="#7c3aed"/><text x="395.0" y="500" text-anchor="middle" class="bt">Milestone 3 · Hardware Enablement</text><text x="110" y="547" class="bs">○ GPIO helper examples</text><text x="110" y="578" class="bs">○ Camera and media documentation</text><text x="110" y="609" class="bs">○ Board health and validation tools</text><text x="110" y="640" class="bs">○ Improved installer workflow</text></g><g filter="url(#s)"><rect x="780" y="455" width="650" height="245" rx="24" fill="#f97316"/><text x="1105.0" y="500" text-anchor="middle" class="bt">Milestone 4 · Stable Automation</text><text x="820" y="547" class="bs">○ CI builds and artifact verification</text><text x="820" y="578" class="bs">○ Automated regression checks</text><text x="820" y="609" class="bs">○ Release candidates and stable channel</text><text x="820" y="640" class="bs">○ Community contribution workflow</text></g><rect x="280" y="755" width="940" height="62" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="750" y="794" text-anchor="middle" class="m">code + hardware evidence + documentation = completed milestone</text></svg>