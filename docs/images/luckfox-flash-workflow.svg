<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu flashing workflow</title>
  <desc id="desc">Workflow showing verification of the release, import into SocToolKit, writing the microSD card, booting the Luckfox Pico Plus, and verifying Ubuntu through UART and SSH.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="build" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="sd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="login" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Luckfox Ubuntu Flash Workflow</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">Verify → write → boot → validate</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="220" height="135" rx="22" fill="url(#build)"/>
    <text x="180" y="207" text-anchor="middle" class="box-title">Release Package</text>
    <text x="180" y="238" text-anchor="middle" class="box-sub">output/release/</text>
    <text x="180" y="264" text-anchor="middle" class="box-sub">Images + metadata</text>
  </g>
  <path d="M290 232 H340" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="340" y="165" width="220" height="135" rx="22" fill="url(#verify)"/>
    <text x="450" y="207" text-anchor="middle" class="box-title">Verify Images</text>
    <text x="450" y="238" text-anchor="middle" class="box-sub">sha256sum -c</text>
    <text x="450" y="264" text-anchor="middle" class="box-sub">All files must be OK</text>
  </g>
  <path d="M560 232 H610" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="610" y="165" width="220" height="135" rx="22" fill="url(#tool)"/>
    <text x="720" y="207" text-anchor="middle" class="box-title">SocToolKit</text>
    <text x="720" y="238" text-anchor="middle" class="box-sub">Import full release</text>
    <text x="720" y="264" text-anchor="middle" class="box-sub">Select SD Card Boot</text>
  </g>
  <path d="M830 232 H880" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="880" y="165" width="220" height="135" rx="22" fill="url(#sd)"/>
    <text x="990" y="207" text-anchor="middle" class="box-title">Write microSD</text>
    <text x="990" y="238" text-anchor="middle" class="box-sub">Create SD Card</text>
    <text x="990" y="264" text-anchor="middle" class="box-sub">All partitions written</text>
  </g>
  <path d="M1100 232 H1150" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1150" y="165" width="190" height="135" rx="22" fill="url(#board)"/>
    <text x="1245" y="207" text-anchor="middle" class="box-title">Luckfox Pico Plus</text>
    <text x="1245" y="238" text-anchor="middle" class="box-sub">Boot from microSD</text>
    <text x="1245" y="264" text-anchor="middle" class="box-sub">Ubuntu 22.04</text>
  </g>

  <path d="M1245 300 V365 H1055" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="845" y="395" width="420" height="165" rx="24" fill="url(#login)"/>
    <text x="1055" y="438" text-anchor="middle" class="box-title">Runtime Validation</text>
    <text x="900" y="482" class="box-sub">UART2 · 115200 baud</text>
    <text x="900" y="514" class="box-sub">DHCP address assigned</text>
    <text x="1080" y="482" class="box-sub">SSH port 22 reachable</text>
    <text x="1080" y="514" class="box-sub">Swap active · system healthy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="115" y="395" width="600" height="165" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="155" y="435" class="label">Pre-flash checklist</text>
    <text x="155" y="472" class="note">✓ Correct SD card selected</text>
    <text x="155" y="503" class="note">✓ env.img and userdata.img present</text>
    <text x="420" y="472" class="note">✓ SHA256 verification passed</text>
    <text x="420" y="503" class="note">✓ Buildroot update.img not selected</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="630" width="820" height="56" rx="18" fill="#0f172a"/>
    <text x="700" y="665" text-anchor="middle" style="font:600 15px ui-monospace, SFMono-Regular, Consolas, monospace; fill:#e2e8f0;">release → verify → SocToolKit → microSD → boot → UART/SSH</text>
  </g>

  <text x="700" y="720" text-anchor="middle" class="note">Use the complete release directory so the boot chain and Ubuntu root filesystem remain consistent.</text>
</svg>