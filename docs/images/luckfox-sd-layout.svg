<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox microSD partition and image layout</title>
  <desc id="desc">Shows the logical microSD card layout with env, idblock, uboot, boot, userdata and rootfs partitions, and identifies which generated image is written to each partition.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="sdcard" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="idb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="uboot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="userdata" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="rootfs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  </defs>

  <rect width="1200" height="850" rx="30" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" class="title">microSD Card Layout</text>
  <text x="600" y="90" text-anchor="middle" class="subtitle">Partition order used by the Luckfox Pico Plus SD-card image</text>

  <!-- SD card body -->
  <g filter="url(#shadow)">
    <path d="M210 145 H820 L930 255 V735 Q930 765 900 765 H210 Q180 765 180 735 V175 Q180 145 210 145 Z" fill="url(#sdcard)"/>
    <path d="M820 145 V255 H930" fill="none" stroke="#64748b" stroke-width="3"/>
    <rect x="230" y="185" width="120" height="65" rx="8" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
    <text x="290" y="225" text-anchor="middle" class="box-sub">microSD</text>
  </g>

  <!-- partitions -->
  <g>
    <rect x="250" y="300" width="620" height="52" rx="10" fill="url(#env)"/>
    <text x="280" y="332" class="box-title">p1 · env</text>
    <text x="825" y="332" text-anchor="end" class="box-sub">env.img · 32 KiB</text>

    <rect x="250" y="365" width="620" height="52" rx="10" fill="url(#idb)"/>
    <text x="280" y="397" class="box-title">p2 · idblock</text>
    <text x="825" y="397" text-anchor="end" class="box-sub">idblock.img · 512 KiB</text>

    <rect x="250" y="430" width="620" height="52" rx="10" fill="url(#uboot)"/>
    <text x="280" y="462" class="box-title">p3 · uboot</text>
    <text x="825" y="462" text-anchor="end" class="box-sub">uboot.img · 256 KiB</text>

    <rect x="250" y="495" width="620" height="52" rx="10" fill="url(#boot)"/>
    <text x="280" y="527" class="box-title">p4 · boot</text>
    <text x="825" y="527" text-anchor="end" class="box-sub">boot.img · 32 MiB</text>

    <rect x="250" y="560" width="620" height="65" rx="10" fill="url(#userdata)"/>
    <text x="280" y="598" class="box-title">p5 · userdata</text>
    <text x="825" y="598" text-anchor="end" class="box-sub">userdata.img · 256 MiB</text>

    <rect x="250" y="638" width="620" height="88" rx="10" fill="url(#rootfs)"/>
    <text x="280" y="685" class="box-title">p6 · rootfs</text>
    <text x="825" y="672" text-anchor="end" class="box-sub">rootfs.img</text>
    <text x="825" y="698" text-anchor="end" class="box-sub">remaining SD-card capacity</text>
  </g>

  <!-- callouts -->
  <g filter="url(#shadow)">
    <rect x="960" y="275" width="190" height="122" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="985" y="310" class="label">Boot chain</text>
    <text x="985" y="341" class="note">env → idblock</text>
    <text x="985" y="368" class="note">→ U-Boot → boot</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="430" width="190" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="985" y="465" class="label">Linux mounts</text>
    <text x="985" y="500" class="mono">p6 → /</text>
    <text x="985" y="532" class="mono">p5 → /userdata</text>
    <text x="985" y="558" class="note">Swapfile lives in /</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="615" width="190" height="110" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="985" y="650" class="label">Important</text>
    <text x="985" y="683" class="note">Do not omit env.img</text>
    <text x="985" y="708" class="note">or userdata.img.</text>
  </g>

  <text x="600" y="808" text-anchor="middle" class="note">The release directory provides one image per required partition plus loader and metadata files.</text>
</svg>