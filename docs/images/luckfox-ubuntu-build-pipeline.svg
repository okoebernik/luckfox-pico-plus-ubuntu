<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu build pipeline</title>
  <desc id="desc">Detailed build pipeline from WSL setup and Luckfox SDK through Ubuntu root filesystem creation, kernel module integration, image packaging, release verification, and flashing to a Luckfox Pico Plus.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sdk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ubuntu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="build" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="image" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>

    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .section { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; letter-spacing: 1.4px; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #fff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .file { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .small { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="920" rx="30" fill="url(#bg)"/>

  <text x="700" y="58" text-anchor="middle" class="title">Luckfox Ubuntu Build Pipeline</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">From WSL setup to a verified, SDTool-compatible Ubuntu release</text>

  <!-- Phase labels -->
  <text x="85" y="135" class="section">1 · PREPARE</text>
  <text x="85" y="345" class="section">2 · BUILD</text>
  <text x="85" y="610" class="section">3 · PACKAGE &amp; FLASH</text>

  <!-- Host environment -->
  <g filter="url(#shadow)">
    <rect x="85" y="155" width="275" height="135" rx="22" fill="url(#host)"/>
    <text x="222" y="198" text-anchor="middle" class="box-title">Windows 11 + WSL2</text>
    <text x="222" y="228" text-anchor="middle" class="box-sub">Ubuntu 22.04 build host</text>
    <text x="222" y="253" text-anchor="middle" class="box-sub">Clean Linux PATH · synced clock</text>
  </g>

  <path d="M360 223 H410" class="connector"/>

  <!-- SDK -->
  <g filter="url(#shadow)">
    <rect x="410" y="155" width="280" height="135" rx="22" fill="url(#sdk)"/>
    <text x="550" y="198" text-anchor="middle" class="box-title">Luckfox SDK</text>
    <text x="550" y="228" text-anchor="middle" class="box-sub">U-Boot · Kernel · Device Tree</text>
    <text x="550" y="253" text-anchor="middle" class="box-sub">RV1103 Pico Plus board config</text>
  </g>

  <path d="M690 223 H740" class="connector"/>

  <!-- Reference build -->
  <g filter="url(#shadow)">
    <rect x="740" y="155" width="290" height="135" rx="22" fill="url(#build)"/>
    <text x="885" y="194" text-anchor="middle" class="box-title">Reference Buildroot Build</text>
    <text x="885" y="226" text-anchor="middle" class="box-sub">Creates working boot and partition images</text>
    <text x="885" y="252" text-anchor="middle" class="box-sub">env.img · boot.img · uboot.img</text>
  </g>

  <path d="M1030 223 H1080" class="connector"/>

  <!-- Ubuntu rootfs -->
  <g filter="url(#shadow)">
    <rect x="1080" y="155" width="235" height="135" rx="22" fill="url(#ubuntu)"/>
    <text x="1197" y="194" text-anchor="middle" class="box-title">Ubuntu RootFS</text>
    <text x="1197" y="226" text-anchor="middle" class="box-sub">debootstrap · ARMHF</text>
    <text x="1197" y="252" text-anchor="middle" class="box-sub">SSH · apt · systemd</text>
  </g>

  <!-- Build branches -->
  <path d="M550 290 V360 H475" class="connector-soft"/>
  <path d="M885 290 V360 H700" class="connector-soft"/>
  <path d="M1197 290 V360 H925" class="connector-soft"/>

  <!-- Build row -->
  <g filter="url(#shadow)">
    <rect x="250" y="365" width="270" height="150" rx="22" fill="url(#build)"/>
    <text x="385" y="407" text-anchor="middle" class="box-title">1. Optimize RootFS</text>
    <text x="385" y="438" text-anchor="middle" class="box-sub">Disable timers and reduce logging</text>
    <text x="385" y="464" text-anchor="middle" class="box-sub">Tune memory and prepare swap</text>
  </g>

  <path d="M520 440 H565" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="565" y="365" width="270" height="150" rx="22" fill="url(#sdk)"/>
    <text x="700" y="407" text-anchor="middle" class="box-title">2. Integrate Modules</text>
    <text x="700" y="438" text-anchor="middle" class="box-sub">Copy 5.10.160 kernel modules</text>
    <text x="700" y="464" text-anchor="middle" class="box-sub">Generate depmod metadata</text>
  </g>

  <path d="M835 440 H880" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="880" y="365" width="270" height="150" rx="22" fill="url(#image)"/>
    <text x="1015" y="407" text-anchor="middle" class="box-title">3. Build RootFS Image</text>
    <text x="1015" y="438" text-anchor="middle" class="box-sub">Create ext4 rootfs.img</text>
    <text x="1015" y="464" text-anchor="middle" class="box-sub">Add 512 MB swapfile</text>
  </g>

  <path d="M1015 515 V585 H335" class="connector"/>

  <!-- Packaging row -->
  <g filter="url(#shadow)">
    <rect x="180" y="625" width="260" height="140" rx="22" fill="url(#image)"/>
    <text x="310" y="666" text-anchor="middle" class="box-title">4. Collect Firmware</text>
    <text x="310" y="697" text-anchor="middle" class="box-sub">Combine Ubuntu image</text>
    <text x="310" y="723" text-anchor="middle" class="box-sub">with SDK boot assets</text>
  </g>

  <path d="M440 695 H490" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="490" y="625" width="260" height="140" rx="22" fill="url(#verify)"/>
    <text x="620" y="666" text-anchor="middle" class="box-title">5. Build Release</text>
    <text x="620" y="697" text-anchor="middle" class="box-sub">Create flash folder</text>
    <text x="620" y="723" text-anchor="middle" class="box-sub">manifest + SHA256SUMS</text>
  </g>

  <path d="M750 695 H800" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="800" y="625" width="240" height="140" rx="22" fill="url(#flash)"/>
    <text x="920" y="666" text-anchor="middle" class="box-title">6. SocToolKit</text>
    <text x="920" y="697" text-anchor="middle" class="box-sub">Import output/release</text>
    <text x="920" y="723" text-anchor="middle" class="box-sub">Create bootable microSD</text>
  </g>

  <path d="M1040 695 H1090" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1090" y="625" width="225" height="140" rx="22" fill="url(#board)"/>
    <text x="1202" y="664" text-anchor="middle" class="box-title">Luckfox Pico Plus</text>
    <text x="1202" y="696" text-anchor="middle" class="box-sub">Ubuntu 22.04 boots</text>
    <text x="1202" y="722" text-anchor="middle" class="box-sub">Ethernet · SSH · apt</text>
  </g>

  <!-- Artifacts -->
  <g>
    <rect x="130" y="810" width="170" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="215" y="834" text-anchor="middle" class="file">boot.img</text>

    <rect x="315" y="810" width="180" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="405" y="834" text-anchor="middle" class="file">rootfs.img</text>

    <rect x="510" y="810" width="190" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="605" y="834" text-anchor="middle" class="file">userdata.img</text>

    <rect x="715" y="810" width="175" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="802" y="834" text-anchor="middle" class="file">env.img</text>

    <rect x="905" y="810" width="185" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="997" y="834" text-anchor="middle" class="file">SHA256SUMS</text>

    <rect x="1105" y="810" width="165" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1187" y="834" text-anchor="middle" class="file">manifest.txt</text>
  </g>

  <text x="700" y="885" text-anchor="middle" class="small">
    One reproducible pipeline: prepare → build → package → verify → flash
  </text>
</svg>