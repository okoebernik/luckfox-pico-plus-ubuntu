<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu first boot workflow</title>
  <desc id="desc">First boot process after flashing, including power on, bootloader, kernel, Ubuntu startup, swap activation, DHCP, console login, and SSH verification.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="power" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="ubuntu" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="network" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="login" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">First Boot Workflow</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">What happens after inserting the prepared microSD card and powering the board</text>

  <!-- main horizontal flow -->
  <g filter="url(#shadow)">
    <rect x="45" y="180" width="170" height="125" rx="22" fill="url(#power)"/>
    <text x="130" y="222" text-anchor="middle" class="box-title">Power On</text>
    <text x="130" y="251" text-anchor="middle" class="box-sub">USB-C power</text>
    <text x="130" y="276" text-anchor="middle" class="box-sub">microSD inserted</text>
  </g>
  <path d="M215 242 H255" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="255" y="180" width="175" height="125" rx="22" fill="url(#boot)"/>
    <text x="342" y="222" text-anchor="middle" class="box-title">Boot Chain</text>
    <text x="342" y="251" text-anchor="middle" class="box-sub">BootROM · idblock</text>
    <text x="342" y="276" text-anchor="middle" class="box-sub">U-Boot</text>
  </g>
  <path d="M430 242 H470" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="470" y="180" width="175" height="125" rx="22" fill="url(#kernel)"/>
    <text x="557" y="222" text-anchor="middle" class="box-title">Linux Kernel</text>
    <text x="557" y="251" text-anchor="middle" class="box-sub">Hardware initialization</text>
    <text x="557" y="276" text-anchor="middle" class="box-sub">Mount rootfs</text>
  </g>
  <path d="M645 242 H685" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="685" y="180" width="185" height="125" rx="22" fill="url(#ubuntu)"/>
    <text x="777" y="222" text-anchor="middle" class="box-title">Ubuntu Startup</text>
    <text x="777" y="251" text-anchor="middle" class="box-sub">systemd services</text>
    <text x="777" y="276" text-anchor="middle" class="box-sub">activate swapfile</text>
  </g>
  <path d="M870 242 H910" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="910" y="180" width="175" height="125" rx="22" fill="url(#network)"/>
    <text x="997" y="222" text-anchor="middle" class="box-title">DHCP</text>
    <text x="997" y="251" text-anchor="middle" class="box-sub">Ethernet link</text>
    <text x="997" y="276" text-anchor="middle" class="box-sub">IP address assigned</text>
  </g>
  <path d="M1085 242 H1125" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1125" y="180" width="225" height="125" rx="22" fill="url(#login)"/>
    <text x="1237" y="222" text-anchor="middle" class="box-title">Login Available</text>
    <text x="1237" y="251" text-anchor="middle" class="box-sub">UART2 console</text>
    <text x="1237" y="276" text-anchor="middle" class="box-sub">SSH via Ethernet</text>
  </g>

  <!-- checks -->
  <path d="M1237 305 V370 H1045" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="830" y="395" width="430" height="205" rx="26" fill="url(#verify)"/>
    <text x="1045" y="438" text-anchor="middle" class="box-title">Post-Boot Verification</text>
    <text x="875" y="482" class="box-sub">free -h</text>
    <text x="875" y="515" class="box-sub">swapon --show</text>
    <text x="875" y="548" class="box-sub">ip address</text>
    <text x="1075" y="482" class="box-sub">df -h /</text>
    <text x="1075" y="515" class="box-sub">uname -a</text>
    <text x="1075" y="548" class="box-sub">systemctl --failed</text>
  </g>

  <!-- serial path -->
  <g filter="url(#shadow)">
    <rect x="90" y="395" width="600" height="205" rx="26" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="130" y="438" style="font:700 18px Inter, Segoe UI, Arial, sans-serif; fill:#0f172a;">Recommended diagnostic path</text>
    <text x="130" y="478" class="note">1. Open UART terminal before applying power.</text>
    <text x="130" y="511" class="note">2. Use UART2 at 115200 baud, 8N1, no flow control.</text>
    <text x="130" y="544" class="note">3. Confirm swap activation before attempting a login.</text>
    <text x="130" y="577" class="note">4. Use SSH only after the board has received a DHCP address.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="335" y="650" width="730" height="54" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="700" y="684" text-anchor="middle" class="note">If login is killed by the OOM killer, verify that the 512 MB swapfile is present and active.</text>
  </g>
</svg>