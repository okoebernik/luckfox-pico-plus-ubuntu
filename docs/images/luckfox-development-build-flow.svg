<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="source" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  <linearGradient id="patch" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="sdk" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="rootfs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="package" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
</defs>
<rect width="1400" height="660" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Development Build Flow</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Source changes become verified board behavior through a repeatable pipeline</text>

<g filter="url(#shadow)">
  <rect x="45" y="180" width="185" height="155" rx="22" fill="url(#source)"/>
  <text x="137" y="222" text-anchor="middle" class="box-title">Sources</text>
  <text x="137" y="253" text-anchor="middle" class="box-sub">Scripts · config</text>
  <text x="137" y="280" text-anchor="middle" class="box-sub">Docs · patches</text>
</g>
<path d="M230 257 H275" class="connector"/>

<g filter="url(#shadow)">
  <rect x="275" y="180" width="185" height="155" rx="22" fill="url(#patch)"/>
  <text x="367" y="222" text-anchor="middle" class="box-title">Apply Changes</text>
  <text x="367" y="253" text-anchor="middle" class="box-sub">SDK patches</text>
  <text x="367" y="280" text-anchor="middle" class="box-sub">RootFS overlay</text>
</g>
<path d="M460 257 H505" class="connector"/>

<g filter="url(#shadow)">
  <rect x="505" y="180" width="185" height="155" rx="22" fill="url(#sdk)"/>
  <text x="597" y="222" text-anchor="middle" class="box-title">Build SDK Assets</text>
  <text x="597" y="253" text-anchor="middle" class="box-sub">Kernel · U-Boot</text>
  <text x="597" y="280" text-anchor="middle" class="box-sub">Modules · firmware</text>
</g>
<path d="M690 257 H735" class="connector"/>

<g filter="url(#shadow)">
  <rect x="735" y="180" width="185" height="155" rx="22" fill="url(#rootfs)"/>
  <text x="827" y="222" text-anchor="middle" class="box-title">Build Ubuntu</text>
  <text x="827" y="253" text-anchor="middle" class="box-sub">RootFS · optimize</text>
  <text x="827" y="280" text-anchor="middle" class="box-sub">Swap · modules</text>
</g>
<path d="M920 257 H965" class="connector"/>

<g filter="url(#shadow)">
  <rect x="965" y="180" width="185" height="155" rx="22" fill="url(#package)"/>
  <text x="1057" y="222" text-anchor="middle" class="box-title">Package Release</text>
  <text x="1057" y="253" text-anchor="middle" class="box-sub">output/release</text>
  <text x="1057" y="280" text-anchor="middle" class="box-sub">SHA256 · manifest</text>
</g>
<path d="M1150 257 H1195" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1195" y="180" width="160" height="155" rx="22" fill="url(#board)"/>
  <text x="1275" y="222" text-anchor="middle" class="box-title">Board Test</text>
  <text x="1275" y="253" text-anchor="middle" class="box-sub">Flash · UART</text>
  <text x="1275" y="280" text-anchor="middle" class="box-sub">Verify behavior</text>
</g>

<g filter="url(#shadow)">
  <rect x="145" y="410" width="1110" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="185" y="450" class="label">Feedback loop</text>
  <text x="185" y="489" class="mono">board result → UART evidence → source adjustment → rebuild</text>
</g>

<path d="M1275 335 V570 H137 V335" class="connector-soft"/>
<text x="700" y="615" text-anchor="middle" class="note">A development change is complete only after a clean rebuild and board verification.</text>
</svg>