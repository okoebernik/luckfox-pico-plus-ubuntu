<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
 <linearGradient id="build" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
 <linearGradient id="collect" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
 <linearGradient id="package" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
 <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
 <linearGradient id="publish" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
</defs>
<rect width="1400" height="570" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Release Pipeline</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">From source tree to a verified SDTool-compatible firmware package</text>

<g filter="url(#shadow)">
 <rect x="60" y="180" width="210" height="160" rx="24" fill="url(#build)"/>
 <text x="165" y="222" text-anchor="middle" class="box-title">Build</text>
 <text x="165" y="252" text-anchor="middle" class="box-sub">Ubuntu RootFS</text>
 <text x="165" y="278" text-anchor="middle" class="box-sub">Kernel modules</text>
 <text x="165" y="304" text-anchor="middle" class="box-sub">rootfs.img</text>
</g>
<path d="M270 260 H320" class="connector"/>

<g filter="url(#shadow)">
 <rect x="320" y="180" width="210" height="160" rx="24" fill="url(#collect)"/>
 <text x="425" y="222" text-anchor="middle" class="box-title">Collect</text>
 <text x="425" y="252" text-anchor="middle" class="box-sub">SDK boot assets</text>
 <text x="425" y="278" text-anchor="middle" class="box-sub">Ubuntu image</text>
 <text x="425" y="304" text-anchor="middle" class="box-sub">Firmware directory</text>
</g>
<path d="M530 260 H580" class="connector"/>

<g filter="url(#shadow)">
 <rect x="580" y="180" width="210" height="160" rx="24" fill="url(#package)"/>
 <text x="685" y="222" text-anchor="middle" class="box-title">Package</text>
 <text x="685" y="252" text-anchor="middle" class="box-sub">output/release/</text>
 <text x="685" y="278" text-anchor="middle" class="box-sub">SDTool layout</text>
 <text x="685" y="304" text-anchor="middle" class="box-sub">Metadata</text>
</g>
<path d="M790 260 H840" class="connector"/>

<g filter="url(#shadow)">
 <rect x="840" y="180" width="210" height="160" rx="24" fill="url(#verify)"/>
 <text x="945" y="222" text-anchor="middle" class="box-title">Verify</text>
 <text x="945" y="252" text-anchor="middle" class="box-sub">SHA256SUMS</text>
 <text x="945" y="278" text-anchor="middle" class="box-sub">manifest.txt</text>
 <text x="945" y="304" text-anchor="middle" class="box-sub">VERSION</text>
</g>
<path d="M1050 260 H1100" class="connector"/>

<g filter="url(#shadow)">
 <rect x="1100" y="180" width="240" height="160" rx="24" fill="url(#publish)"/>
 <text x="1220" y="222" text-anchor="middle" class="box-title">Flash or Publish</text>
 <text x="1220" y="252" text-anchor="middle" class="box-sub">SocToolKit</text>
 <text x="1220" y="278" text-anchor="middle" class="box-sub">GitHub Release</text>
 <text x="1220" y="304" text-anchor="middle" class="box-sub">Known-good artifacts</text>
</g>

<g filter="url(#shadow)">
 <rect x="190" y="415" width="1020" height="78" rx="22" fill="#fff" stroke="#cbd5e1"/>
 <text x="230" y="445" class="note">Core release artifacts:</text>
 <text x="230" y="472" class="mono">boot.img · rootfs.img · userdata.img · env.img · uboot.img · idblock.img · SHA256SUMS</text>
</g>
</svg>