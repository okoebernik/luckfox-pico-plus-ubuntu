<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu runtime memory monitoring</title>
  <desc id="desc">Runtime monitoring flow using free, swapon, process RSS, vmstat, systemd and kernel OOM logs.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="swap" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="proc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="services" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="oom" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  </defs>

  <rect width="1400" height="650" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Runtime Memory Monitoring</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">Use several views together; no single command tells the complete story</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="190" height="145" rx="22" fill="url(#ram)"/>
    <text x="155" y="212" text-anchor="middle" class="box-title">RAM</text>
    <text x="155" y="244" text-anchor="middle" class="box-sub">free -h</text>
    <text x="155" y="272" text-anchor="middle" class="box-sub">Watch available memory</text>
  </g>
  <path d="M250 242 H290" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="290" y="170" width="190" height="145" rx="22" fill="url(#swap)"/>
    <text x="385" y="212" text-anchor="middle" class="box-title">Swap</text>
    <text x="385" y="244" text-anchor="middle" class="box-sub">swapon --show</text>
    <text x="385" y="272" text-anchor="middle" class="box-sub">Confirm active backing</text>
  </g>
  <path d="M480 242 H520" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="520" y="170" width="190" height="145" rx="22" fill="url(#proc)"/>
    <text x="615" y="212" text-anchor="middle" class="box-title">Processes</text>
    <text x="615" y="244" text-anchor="middle" class="box-sub">ps --sort=-rss</text>
    <text x="615" y="272" text-anchor="middle" class="box-sub">Find large consumers</text>
  </g>
  <path d="M710 242 H750" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="750" y="170" width="190" height="145" rx="22" fill="url(#vm)"/>
    <text x="845" y="212" text-anchor="middle" class="box-title">VM Activity</text>
    <text x="845" y="244" text-anchor="middle" class="box-sub">vmstat 1</text>
    <text x="845" y="272" text-anchor="middle" class="box-sub">Observe swap I/O</text>
  </g>
  <path d="M940 242 H980" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="980" y="170" width="190" height="145" rx="22" fill="url(#services)"/>
    <text x="1075" y="212" text-anchor="middle" class="box-title">Services</text>
    <text x="1075" y="244" text-anchor="middle" class="box-sub">systemctl --failed</text>
    <text x="1075" y="272" text-anchor="middle" class="box-sub">Check background load</text>
  </g>
  <path d="M1170 242 H1210" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1210" y="170" width="145" height="145" rx="22" fill="url(#oom)"/>
    <text x="1282" y="212" text-anchor="middle" class="box-title">OOM Logs</text>
    <text x="1282" y="244" text-anchor="middle" class="box-sub">dmesg</text>
    <text x="1282" y="272" text-anchor="middle" class="box-sub">Killed process?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="180" y="390" width="1040" height="145" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="220" y="430" class="label">Healthy runtime indicators</text>
    <text x="220" y="470" class="note">• `available` memory remains above the immediate failure threshold</text>
    <text x="220" y="500" class="note">• swap usage changes gradually instead of growing continuously</text>
    <text x="730" y="470" class="note">• no repeated OOM-killer entries appear in `dmesg`</text>
    <text x="730" y="500" class="note">• interactive login and SSH remain responsive</text>
  </g>

  <text x="700" y="590" text-anchor="middle" class="note">Monitor before and after every new service or package installation.</text>
</svg>