<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu release layout</title>
  <desc id="desc">Overview of all files in output/release, grouped by boot chain, Linux system, flash configuration, and release metadata.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="linux" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="meta" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  </defs>

  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Release Directory Layout</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">Files generated in output/release and their responsibilities</text>

  <!-- Root folder -->
  <g filter="url(#shadow)">
    <path d="M85 145 h250 l32 36 h300 a18 18 0 0 1 18 18 v68 a18 18 0 0 1-18 18 H85 a18 18 0 0 1-18-18 V163 a18 18 0 0 1 18-18z" fill="url(#folder)"/>
    <text x="375" y="205" text-anchor="middle" class="box-title">output/release/</text>
    <text x="375" y="238" text-anchor="middle" class="box-sub">Complete SDTool-compatible firmware package</text>
  </g>

  <path d="M375 285 V330 H240" class="connector-soft"/>
  <path d="M375 285 V330 H555" class="connector-soft"/>
  <path d="M375 285 V330 H870" class="connector-soft"/>
  <path d="M375 285 V330 H1185" class="connector-soft"/>

  <!-- Group 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="350" width="330" height="410" rx="26" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="70" y="350" width="330" height="72" rx="26" fill="url(#boot)"/>
    <rect x="70" y="396" width="330" height="26" fill="url(#boot)"/>
    <text x="235" y="394" text-anchor="middle" class="box-title">Boot Chain</text>

    <text x="105" y="465" class="mono">download.bin</text>
    <text x="105" y="488" class="note">Rockchip loader used by SocToolKit</text>

    <text x="105" y="535" class="mono">idblock.img</text>
    <text x="105" y="558" class="note">Early boot and DDR initialization</text>

    <text x="105" y="605" class="mono">uboot.img</text>
    <text x="105" y="628" class="note">U-Boot bootloader image</text>

    <text x="105" y="675" class="mono">boot.img</text>
    <text x="105" y="698" class="note">Kernel and Device Tree</text>
  </g>

  <!-- Group 2 -->
  <g filter="url(#shadow)">
    <rect x="430" y="350" width="330" height="410" rx="26" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="430" y="350" width="330" height="72" rx="26" fill="url(#linux)"/>
    <rect x="430" y="396" width="330" height="26" fill="url(#linux)"/>
    <text x="595" y="394" text-anchor="middle" class="box-title">Linux System</text>

    <text x="465" y="465" class="mono">rootfs.img</text>
    <text x="465" y="488" class="note">Ubuntu 22.04 ext4 root filesystem</text>

    <text x="465" y="535" class="mono">userdata.img</text>
    <text x="465" y="558" class="note">Separate writable userdata partition</text>

    <rect x="465" y="605" width="260" height="92" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="490" y="637" class="label">Mounted on target</text>
    <text x="490" y="666" class="mono">/dev/mmcblk1p6 → /</text>
    <text x="490" y="690" class="mono">/dev/mmcblk1p5 → /userdata</text>
  </g>

  <!-- Group 3 -->
  <g filter="url(#shadow)">
    <rect x="790" y="350" width="330" height="410" rx="26" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="790" y="350" width="330" height="72" rx="26" fill="url(#flash)"/>
    <rect x="790" y="396" width="330" height="26" fill="url(#flash)"/>
    <text x="955" y="394" text-anchor="middle" class="box-title">Flash Configuration</text>

    <text x="825" y="465" class="mono">env.img</text>
    <text x="825" y="488" class="note">Partition environment image</text>

    <text x="825" y="535" class="mono">.env.txt</text>
    <text x="825" y="558" class="note">Human-readable partition definition</text>

    <text x="825" y="605" class="mono">sd_update.txt</text>
    <text x="825" y="628" class="note">SocToolKit SD card update script</text>

    <text x="825" y="675" class="mono">tftp_update.txt</text>
    <text x="825" y="698" class="note">TFTP update description</text>
  </g>

  <!-- Group 4 -->
  <g filter="url(#shadow)">
    <rect x="1150" y="350" width="180" height="410" rx="26" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1150" y="350" width="180" height="72" rx="26" fill="url(#meta)"/>
    <rect x="1150" y="396" width="180" height="26" fill="url(#meta)"/>
    <text x="1240" y="394" text-anchor="middle" class="box-title">Metadata</text>

    <text x="1175" y="465" class="mono">VERSION</text>
    <text x="1175" y="488" class="note">Release version</text>

    <text x="1175" y="550" class="mono">manifest.txt</text>
    <text x="1175" y="573" class="note">Build summary</text>

    <text x="1175" y="635" class="mono">SHA256SUMS</text>
    <text x="1175" y="658" class="note">Integrity checks</text>
  </g>

  <!-- Verification command -->
  <g filter="url(#shadow)">
    <rect x="250" y="800" width="900" height="62" rx="20" fill="#0f172a"/>
    <text x="700" y="839" text-anchor="middle" style="font:600 16px ui-monospace, SFMono-Regular, Consolas, monospace; fill:#e2e8f0;">cd output/release &amp;&amp; sha256sum -c SHA256SUMS</text>
  </g>
</svg>