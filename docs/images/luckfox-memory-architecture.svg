<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu memory architecture</title>
  <desc id="desc">Memory architecture showing applications, Ubuntu userspace, Linux kernel, approximately 31 MiB usable RAM, a 512 MiB swapfile and the microSD card.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="apps" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="userspace" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="swap" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
    <linearGradient id="sd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Memory Architecture</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">How Ubuntu operates on an extremely constrained Luckfox Pico Plus</text>

  <g filter="url(#shadow)">
    <rect x="405" y="145" width="590" height="90" rx="22" fill="url(#apps)"/>
    <text x="700" y="185" text-anchor="middle" class="box-title">Applications and Services</text>
    <text x="700" y="212" text-anchor="middle" class="box-sub">SSH · apt · shell · networking · user processes</text>
  </g>
  <path d="M700 235 V270" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="405" y="270" width="590" height="90" rx="22" fill="url(#userspace)"/>
    <text x="700" y="310" text-anchor="middle" class="box-title">Ubuntu 22.04 Userspace</text>
    <text x="700" y="337" text-anchor="middle" class="box-sub">systemd · libc · OpenSSH · package management</text>
  </g>
  <path d="M700 360 V395" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="405" y="395" width="590" height="90" rx="22" fill="url(#kernel)"/>
    <text x="700" y="435" text-anchor="middle" class="box-title">Linux Kernel 5.10.160</text>
    <text x="700" y="462" text-anchor="middle" class="box-sub">Memory management · drivers · page cache · OOM killer</text>
  </g>

  <path d="M590 485 V530 H395" class="connector"/>
  <path d="M810 485 V530 H1005" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="175" y="535" width="440" height="135" rx="24" fill="url(#ram)"/>
    <text x="395" y="580" text-anchor="middle" class="box-title">Physical RAM</text>
    <text x="395" y="612" text-anchor="middle" class="box-sub">Approximately 31 MiB visible to Linux</text>
    <text x="395" y="638" text-anchor="middle" class="box-sub">Fast, scarce and shared by everything</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="785" y="535" width="440" height="135" rx="24" fill="url(#swap)"/>
    <text x="1005" y="580" text-anchor="middle" class="box-title">Swapfile</text>
    <text x="1005" y="612" text-anchor="middle" class="box-sub">Approximately 512 MiB on rootfs</text>
    <text x="1005" y="638" text-anchor="middle" class="box-sub">Slower, but essential for stability</text>
  </g>

  <path d="M1005 670 V700" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="835" y="700" width="340" height="42" rx="16" fill="url(#sd)"/>
    <text x="1005" y="727" text-anchor="middle" class="box-sub">microSD card · /swapfile</text>
  </g>

  <text x="700" y="728" text-anchor="middle" class="note">Linux moves inactive pages to swap so that active services and logins can continue to run.</text>
</svg>