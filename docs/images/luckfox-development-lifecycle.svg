<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="plan" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="impl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="test" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="review" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  <linearGradient id="release" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="640" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Development Lifecycle</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">From a well-defined change to a reproducible release</text>

<g filter="url(#shadow)">
  <rect x="55" y="190" width="180" height="155" rx="22" fill="url(#plan)"/>
  <text x="145" y="232" text-anchor="middle" class="box-title">Plan</text>
  <text x="145" y="263" text-anchor="middle" class="box-sub">Define one change</text>
  <text x="145" y="290" text-anchor="middle" class="box-sub">Acceptance criteria</text>
</g>
<path d="M235 267 H285" class="connector"/>

<g filter="url(#shadow)">
  <rect x="285" y="190" width="180" height="155" rx="22" fill="url(#branch)"/>
  <text x="375" y="232" text-anchor="middle" class="box-title">Branch</text>
  <text x="375" y="263" text-anchor="middle" class="box-sub">Create focused branch</text>
  <text x="375" y="290" text-anchor="middle" class="box-sub">Record baseline</text>
</g>
<path d="M465 267 H515" class="connector"/>

<g filter="url(#shadow)">
  <rect x="515" y="190" width="180" height="155" rx="22" fill="url(#impl)"/>
  <text x="605" y="232" text-anchor="middle" class="box-title">Implement</text>
  <text x="605" y="263" text-anchor="middle" class="box-sub">Small commits</text>
  <text x="605" y="290" text-anchor="middle" class="box-sub">Update docs</text>
</g>
<path d="M695 267 H745" class="connector"/>

<g filter="url(#shadow)">
  <rect x="745" y="190" width="180" height="155" rx="22" fill="url(#test)"/>
  <text x="835" y="232" text-anchor="middle" class="box-title">Build &amp; Test</text>
  <text x="835" y="263" text-anchor="middle" class="box-sub">Build · flash · boot</text>
  <text x="835" y="290" text-anchor="middle" class="box-sub">Regression checks</text>
</g>
<path d="M925 267 H975" class="connector"/>

<g filter="url(#shadow)">
  <rect x="975" y="190" width="180" height="155" rx="22" fill="url(#review)"/>
  <text x="1065" y="232" text-anchor="middle" class="box-title">Review</text>
  <text x="1065" y="263" text-anchor="middle" class="box-sub">Logs · diff · quality</text>
  <text x="1065" y="290" text-anchor="middle" class="box-sub">One root cause</text>
</g>
<path d="M1155 267 H1205" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1205" y="190" width="150" height="155" rx="22" fill="url(#release)"/>
  <text x="1280" y="232" text-anchor="middle" class="box-title">Release</text>
  <text x="1280" y="263" text-anchor="middle" class="box-sub">Tag · package</text>
  <text x="1280" y="290" text-anchor="middle" class="box-sub">Verify artifacts</text>
</g>

<g filter="url(#shadow)">
  <rect x="175" y="420" width="1050" height="110" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="215" y="462" class="label">Core development rule</text>
  <text x="215" y="500" class="mono">one feature → one branch → one reproducible test result</text>
</g>

<text x="700" y="585" text-anchor="middle" class="note">Every successful change should be buildable, testable, reviewable and documented.</text>
</svg>