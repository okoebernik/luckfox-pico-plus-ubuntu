<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu development setup</title>
  <desc id="desc">Development flow from Windows 11 and WSL2 through repository setup, SDK download, build, release packaging, SD card flashing and the Luckfox Pico Plus.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="windows" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="wsl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="repo" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="sdk" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="build" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="release" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Development Setup</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">From a clean Windows host to a bootable Ubuntu image for the Luckfox Pico Plus</text>

  <!-- Top row -->
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="220" height="130" rx="22" fill="url(#windows)"/>
    <text x="180" y="207" text-anchor="middle" class="box-title">Windows 11</text>
    <text x="180" y="238" text-anchor="middle" class="box-sub">Host operating system</text>
    <text x="180" y="264" text-anchor="middle" class="box-sub">GitHub · browser · SocToolKit</text>
  </g>
  <path d="M290 230 H340" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="340" y="165" width="220" height="130" rx="22" fill="url(#wsl)"/>
    <text x="450" y="207" text-anchor="middle" class="box-title">WSL2</text>
    <text x="450" y="238" text-anchor="middle" class="box-sub">Ubuntu 22.04 build host</text>
    <text x="450" y="264" text-anchor="middle" class="box-sub">Native Linux filesystem</text>
  </g>
  <path d="M560 230 H610" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="610" y="165" width="220" height="130" rx="22" fill="url(#repo)"/>
    <text x="720" y="207" text-anchor="middle" class="box-title">Project Repository</text>
    <text x="720" y="238" text-anchor="middle" class="box-sub">Configuration · scripts · docs</text>
    <text x="720" y="264" text-anchor="middle" class="box-sub">git clone</text>
  </g>
  <path d="M830 230 H880" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="880" y="165" width="220" height="130" rx="22" fill="url(#sdk)"/>
    <text x="990" y="207" text-anchor="middle" class="box-title">Luckfox SDK</text>
    <text x="990" y="238" text-anchor="middle" class="box-sub">Kernel · U-Boot · drivers</text>
    <text x="990" y="264" text-anchor="middle" class="box-sub">Pico Plus board config</text>
  </g>

  <path d="M990 295 V365 H350" class="connector"/>

  <!-- Bottom row -->
  <g filter="url(#shadow)">
    <rect x="210" y="390" width="250" height="145" rx="22" fill="url(#build)"/>
    <text x="335" y="433" text-anchor="middle" class="box-title">Build Pipeline</text>
    <text x="335" y="464" text-anchor="middle" class="box-sub">./scripts/build-all.sh</text>
    <text x="335" y="490" text-anchor="middle" class="box-sub">RootFS · modules · packaging</text>
  </g>
  <path d="M460 462 H520" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="520" y="390" width="250" height="145" rx="22" fill="url(#release)"/>
    <text x="645" y="433" text-anchor="middle" class="box-title">Release Package</text>
    <text x="645" y="464" text-anchor="middle" class="box-sub">output/release/</text>
    <text x="645" y="490" text-anchor="middle" class="box-sub">Images · manifest · SHA256</text>
  </g>
  <path d="M770 462 H830" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="830" y="390" width="230" height="145" rx="22" fill="url(#flash)"/>
    <text x="945" y="433" text-anchor="middle" class="box-title">SocToolKit</text>
    <text x="945" y="464" text-anchor="middle" class="box-sub">Create SD Card</text>
    <text x="945" y="490" text-anchor="middle" class="box-sub">Writes partition images</text>
  </g>
  <path d="M1060 462 H1120" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1120" y="390" width="220" height="145" rx="22" fill="url(#board)"/>
    <text x="1230" y="433" text-anchor="middle" class="box-title">Luckfox Pico Plus</text>
    <text x="1230" y="464" text-anchor="middle" class="box-sub">microSD boot</text>
    <text x="1230" y="490" text-anchor="middle" class="box-sub">Ubuntu · Ethernet · SSH</text>
  </g>

  <!-- command strip -->
  <g filter="url(#shadow)">
    <rect x="170" y="615" width="1060" height="72" rx="22" fill="#0f172a"/>
    <text x="700" y="659" text-anchor="middle" style="font:600 16px ui-monospace, SFMono-Regular, Consolas, monospace; fill:#e2e8f0;">setup-wsl.sh → clone-sdk.sh → build-all.sh → SocToolKit → boot</text>
  </g>

  <text x="700" y="722" text-anchor="middle" class="note">Keep the project under ~/projects instead of /mnt/c to avoid filesystem and timestamp issues.</text>
</svg>