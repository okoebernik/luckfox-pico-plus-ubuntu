<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="link" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  <linearGradient id="dhcp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  <linearGradient id="route" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="dns" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="service" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="730" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Network Diagnostic Path</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Verify link, address, route, name resolution and service reachability separately</text>

<g filter="url(#shadow)">
  <rect x="75" y="180" width="220" height="160" rx="22" fill="url(#link)"/>
  <text x="185" y="222" text-anchor="middle" class="box-title">1 · Physical Link</text>
  <text x="185" y="253" text-anchor="middle" class="box-sub">Cable · switch · LEDs</text>
  <text x="185" y="280" text-anchor="middle" class="box-sub">ip -br link</text>
</g>
<path d="M295 260 H350" class="connector"/>

<g filter="url(#shadow)">
  <rect x="350" y="180" width="220" height="160" rx="22" fill="url(#dhcp)"/>
  <text x="460" y="222" text-anchor="middle" class="box-title">2 · Address</text>
  <text x="460" y="253" text-anchor="middle" class="box-sub">DHCP lease</text>
  <text x="460" y="280" text-anchor="middle" class="box-sub">ip -br address</text>
</g>
<path d="M570 260 H625" class="connector"/>

<g filter="url(#shadow)">
  <rect x="625" y="180" width="220" height="160" rx="22" fill="url(#route)"/>
  <text x="735" y="222" text-anchor="middle" class="box-title">3 · Routing</text>
  <text x="735" y="253" text-anchor="middle" class="box-sub">Default gateway</text>
  <text x="735" y="280" text-anchor="middle" class="box-sub">ip route</text>
</g>
<path d="M845 260 H900" class="connector"/>

<g filter="url(#shadow)">
  <rect x="900" y="180" width="220" height="160" rx="22" fill="url(#dns)"/>
  <text x="1010" y="222" text-anchor="middle" class="box-title">4 · DNS</text>
  <text x="1010" y="253" text-anchor="middle" class="box-sub">Resolver works</text>
  <text x="1010" y="280" text-anchor="middle" class="box-sub">getent hosts</text>
</g>
<path d="M1120 260 H1175" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1175" y="180" width="175" height="160" rx="22" fill="url(#service)"/>
  <text x="1262" y="222" text-anchor="middle" class="box-title">5 · Service</text>
  <text x="1262" y="253" text-anchor="middle" class="box-sub">Port 22</text>
  <text x="1262" y="280" text-anchor="middle" class="box-sub">ss · nc · ssh</text>
</g>

<g filter="url(#shadow)">
  <rect x="100" y="420" width="550" height="200" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="140" y="462" class="label">Board-side commands</text>
  <text x="140" y="502" class="mono">ip -br link</text>
  <text x="140" y="534" class="mono">ip -br address</text>
  <text x="140" y="566" class="mono">ip route</text>
  <text x="140" y="598" class="mono">ss -ltn</text>
</g>

<g filter="url(#shadow)">
  <rect x="750" y="420" width="550" height="200" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="790" y="462" class="label">Remote tests</text>
  <text x="790" y="502" class="mono">ping &lt;board-ip&gt;</text>
  <text x="790" y="534" class="mono">nc -vz &lt;board-ip&gt; 22</text>
  <text x="790" y="566" class="mono">ssh -vvv pico@&lt;board-ip&gt;</text>
  <text x="790" y="598" class="note">Use UART when remote tests fail.</text>
</g>

<text x="700" y="680" text-anchor="middle" class="note">An assigned IP address does not prove that routing, DNS or SSH is working.</text>
</svg>