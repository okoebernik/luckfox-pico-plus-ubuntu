<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu flash verification workflow</title>
  <desc id="desc">Verification flow from power on through UART output, kernel startup, Ubuntu systemd, swap activation, DHCP, SSH and final health checks.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="step1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="step2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="step3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="step4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="step5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Flash Verification</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">Confirm each stage before treating the SD card as successfully flashed</text>

  <!-- flow -->
  <g filter="url(#shadow)">
    <rect x="55" y="165" width="180" height="120" rx="22" fill="url(#step1)"/>
    <text x="145" y="207" text-anchor="middle" class="box-title">1 · Power</text>
    <text x="145" y="238" text-anchor="middle" class="box-sub">Board starts</text>
    <text x="145" y="263" text-anchor="middle" class="box-sub">Link LEDs active</text>
  </g>
  <path d="M235 225 H275" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="275" y="165" width="180" height="120" rx="22" fill="url(#step2)"/>
    <text x="365" y="207" text-anchor="middle" class="box-title">2 · UART</text>
    <text x="365" y="238" text-anchor="middle" class="box-sub">BootROM / U-Boot</text>
    <text x="365" y="263" text-anchor="middle" class="box-sub">115200 8N1</text>
  </g>
  <path d="M455 225 H495" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="495" y="165" width="180" height="120" rx="22" fill="url(#step3)"/>
    <text x="585" y="207" text-anchor="middle" class="box-title">3 · Kernel</text>
    <text x="585" y="238" text-anchor="middle" class="box-sub">Linux 5.10.160</text>
    <text x="585" y="263" text-anchor="middle" class="box-sub">rootfs mounted</text>
  </g>
  <path d="M675 225 H715" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="715" y="165" width="180" height="120" rx="22" fill="url(#step4)"/>
    <text x="805" y="207" text-anchor="middle" class="box-title">4 · Ubuntu</text>
    <text x="805" y="238" text-anchor="middle" class="box-sub">systemd starts</text>
    <text x="805" y="263" text-anchor="middle" class="box-sub">swap activates</text>
  </g>
  <path d="M895 225 H935" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="935" y="165" width="180" height="120" rx="22" fill="url(#step5)"/>
    <text x="1025" y="207" text-anchor="middle" class="box-title">5 · Network</text>
    <text x="1025" y="238" text-anchor="middle" class="box-sub">DHCP lease</text>
    <text x="1025" y="263" text-anchor="middle" class="box-sub">SSH port 22</text>
  </g>
  <path d="M1115 225 H1155" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1155" y="165" width="190" height="120" rx="22" fill="url(#success)"/>
    <text x="1250" y="207" text-anchor="middle" class="box-title">6 · Success</text>
    <text x="1250" y="238" text-anchor="middle" class="box-sub">Login works</text>
    <text x="1250" y="263" text-anchor="middle" class="box-sub">Health checks pass</text>
  </g>

  <!-- expected signals -->
  <g filter="url(#shadow)">
    <rect x="95" y="360" width="560" height="230" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="135" y="402" class="label">Expected UART milestones</text>
    <text x="135" y="442" class="mono">U-Boot 2017...</text>
    <text x="135" y="477" class="mono">Starting kernel ...</text>
    <text x="135" y="512" class="mono">Ubuntu 22.04 LTS luckfox ttyFIQ0</text>
    <text x="135" y="547" class="mono">luckfox login:</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="745" y="360" width="560" height="230" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="785" y="402" class="label">Recommended health checks</text>
    <text x="785" y="442" class="mono">cat /etc/os-release</text>
    <text x="785" y="477" class="mono">free -h &amp;&amp; swapon --show</text>
    <text x="785" y="512" class="mono">ip address</text>
    <text x="785" y="547" class="mono">sudo systemctl --failed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="635" width="740" height="58" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="700" y="671" text-anchor="middle" class="note">A successful flash is confirmed only after Ubuntu boots, swap is active, networking works and login succeeds.</text>
  </g>
</svg>