<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Pico Plus boot process</title>
  <desc id="desc">Boot flow from Rockchip BootROM through idblock, U-Boot, Linux kernel, Ubuntu root filesystem, systemd, and login services.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="rom" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="idb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="uboot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="rootfs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="systemd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="login" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Luckfox Pico Plus Boot Process</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">From SoC reset to an interactive Ubuntu login</text>

  <!-- Main flow -->
  <g filter="url(#shadow)">
    <rect x="65" y="175" width="160" height="125" rx="22" fill="url(#rom)"/>
    <text x="145" y="218" text-anchor="middle" class="box-title">BootROM</text>
    <text x="145" y="246" text-anchor="middle" class="box-sub">RV1103 internal ROM</text>
    <text x="145" y="270" text-anchor="middle" class="box-sub">Finds boot media</text>
  </g>
  <path d="M225 238 H275" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="275" y="175" width="165" height="125" rx="22" fill="url(#idb)"/>
    <text x="357" y="218" text-anchor="middle" class="box-title">idblock</text>
    <text x="357" y="246" text-anchor="middle" class="box-sub">DDR initialization</text>
    <text x="357" y="270" text-anchor="middle" class="box-sub">Loads U-Boot</text>
  </g>
  <path d="M440 238 H490" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="490" y="175" width="170" height="125" rx="22" fill="url(#uboot)"/>
    <text x="575" y="218" text-anchor="middle" class="box-title">U-Boot</text>
    <text x="575" y="246" text-anchor="middle" class="box-sub">Loads boot.img</text>
    <text x="575" y="270" text-anchor="middle" class="box-sub">Sets kernel arguments</text>
  </g>
  <path d="M660 238 H710" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="710" y="175" width="180" height="125" rx="22" fill="url(#kernel)"/>
    <text x="800" y="218" text-anchor="middle" class="box-title">Linux Kernel</text>
    <text x="800" y="246" text-anchor="middle" class="box-sub">5.10.160 + Device Tree</text>
    <text x="800" y="270" text-anchor="middle" class="box-sub">Initializes hardware</text>
  </g>
  <path d="M890 238 H940" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="940" y="175" width="190" height="125" rx="22" fill="url(#rootfs)"/>
    <text x="1035" y="218" text-anchor="middle" class="box-title">Ubuntu RootFS</text>
    <text x="1035" y="246" text-anchor="middle" class="box-sub">/dev/mmcblk1p6</text>
    <text x="1035" y="270" text-anchor="middle" class="box-sub">Mounts ext4 + swap</text>
  </g>
  <path d="M1130 238 H1180" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1180" y="175" width="155" height="125" rx="22" fill="url(#systemd)"/>
    <text x="1257" y="218" text-anchor="middle" class="box-title">systemd</text>
    <text x="1257" y="246" text-anchor="middle" class="box-sub">PID 1</text>
    <text x="1257" y="270" text-anchor="middle" class="box-sub">Starts services</text>
  </g>

  <!-- Service fan-out -->
  <path d="M1257 300 V370 H1030" class="connector-soft"/>
  <path d="M1257 300 V370 H1257" class="connector-soft"/>

  <g filter="url(#shadow)">
    <rect x="865" y="390" width="330" height="130" rx="22" fill="url(#login)"/>
    <text x="1030" y="432" text-anchor="middle" class="box-title">Console Login</text>
    <text x="1030" y="463" text-anchor="middle" class="box-sub">ttyFIQ0 · UART2 · 115200 8N1</text>
    <text x="1030" y="489" text-anchor="middle" class="box-sub">Local recovery and boot diagnostics</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1195" y="390" width="160" height="130" rx="22" fill="url(#login)"/>
    <text x="1275" y="432" text-anchor="middle" class="box-title">SSH</text>
    <text x="1275" y="463" text-anchor="middle" class="box-sub">Ethernet</text>
    <text x="1275" y="489" text-anchor="middle" class="box-sub">Remote shell</text>
  </g>

  <!-- Partition reference -->
  <text x="80" y="385" class="label">microSD partition map</text>
  <g>
    <rect x="80" y="410" width="125" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="142" y="435" text-anchor="middle" class="mono">p1 env</text>
    <text x="142" y="456" text-anchor="middle" class="note">32 KiB</text>

    <rect x="215" y="410" width="135" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="282" y="435" text-anchor="middle" class="mono">p2 idblock</text>
    <text x="282" y="456" text-anchor="middle" class="note">512 KiB</text>

    <rect x="360" y="410" width="125" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="422" y="435" text-anchor="middle" class="mono">p3 uboot</text>
    <text x="422" y="456" text-anchor="middle" class="note">256 KiB</text>

    <rect x="495" y="410" width="125" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="557" y="435" text-anchor="middle" class="mono">p4 boot</text>
    <text x="557" y="456" text-anchor="middle" class="note">32 MiB</text>

    <rect x="630" y="410" width="145" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="702" y="435" text-anchor="middle" class="mono">p5 userdata</text>
    <text x="702" y="456" text-anchor="middle" class="note">256 MiB</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="540" width="610" height="115" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="110" y="578" class="label">Key boot dependency</text>
    <text x="110" y="607" class="note">boot.img, kernel modules and rootfs.img must use the same kernel release.</text>
    <text x="110" y="633" class="note">The current project aligns all modules with Linux 5.10.160 before packaging.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="735" y="565" width="570" height="90" rx="22" fill="#fff7ed" stroke="#fdba74"/>
    <text x="765" y="600" class="label">Low-memory requirement</text>
    <text x="765" y="629" class="note">Swap must become active before memory-intensive login processes are started.</text>
  </g>

  <text x="700" y="715" text-anchor="middle" class="note">BootROM → idblock → U-Boot → kernel → Ubuntu root filesystem → systemd → login</text>
</svg>