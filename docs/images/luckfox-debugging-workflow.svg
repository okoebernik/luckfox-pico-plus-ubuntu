<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="observe" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  <linearGradient id="uart" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="system" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="isolate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="fix" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="680" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Developer Debugging Workflow</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Use evidence from the lowest failing layer before modifying code</text>

<g filter="url(#shadow)">
  <rect x="55" y="180" width="180" height="155" rx="22" fill="url(#observe)"/>
  <text x="145" y="222" text-anchor="middle" class="box-title">Observe</text>
  <text x="145" y="253" text-anchor="middle" class="box-sub">Exact symptom</text>
  <text x="145" y="280" text-anchor="middle" class="box-sub">Expected behavior</text>
</g>
<path d="M235 257 H285" class="connector"/>

<g filter="url(#shadow)">
  <rect x="285" y="180" width="180" height="155" rx="22" fill="url(#uart)"/>
  <text x="375" y="222" text-anchor="middle" class="box-title">Capture UART</text>
  <text x="375" y="253" text-anchor="middle" class="box-sub">Bootloader · kernel</text>
  <text x="375" y="280" text-anchor="middle" class="box-sub">First error</text>
</g>
<path d="M465 257 H515" class="connector"/>

<g filter="url(#shadow)">
  <rect x="515" y="180" width="180" height="155" rx="22" fill="url(#system)"/>
  <text x="605" y="222" text-anchor="middle" class="box-title">Collect State</text>
  <text x="605" y="253" text-anchor="middle" class="box-sub">dmesg · journal</text>
  <text x="605" y="280" text-anchor="middle" class="box-sub">Memory · network</text>
</g>
<path d="M695 257 H745" class="connector"/>

<g filter="url(#shadow)">
  <rect x="745" y="180" width="180" height="155" rx="22" fill="url(#isolate)"/>
  <text x="835" y="222" text-anchor="middle" class="box-title">Isolate</text>
  <text x="835" y="253" text-anchor="middle" class="box-sub">One layer</text>
  <text x="835" y="280" text-anchor="middle" class="box-sub">One likely cause</text>
</g>
<path d="M925 257 H975" class="connector"/>

<g filter="url(#shadow)">
  <rect x="975" y="180" width="180" height="155" rx="22" fill="url(#fix)"/>
  <text x="1065" y="222" text-anchor="middle" class="box-title">Apply Fix</text>
  <text x="1065" y="253" text-anchor="middle" class="box-sub">Smallest change</text>
  <text x="1065" y="280" text-anchor="middle" class="box-sub">Rollback ready</text>
</g>
<path d="M1155 257 H1205" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1205" y="180" width="150" height="155" rx="22" fill="url(#verify)"/>
  <text x="1280" y="222" text-anchor="middle" class="box-title">Verify</text>
  <text x="1280" y="253" text-anchor="middle" class="box-sub">Rebuild · reboot</text>
  <text x="1280" y="280" text-anchor="middle" class="box-sub">Regression test</text>
</g>

<g filter="url(#shadow)">
  <rect x="140" y="410" width="1120" height="155" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="180" y="452" class="label">Primary developer evidence</text>
  <text x="180" y="492" class="mono">UART log · build log · git diff · dmesg · journalctl -b · free -h · swapon --show</text>
  <text x="180" y="528" class="note">Keep the failing and fixed logs together so the root cause remains reviewable.</text>
</g>

<path d="M1280 335 V605 H145 V335" class="connector-soft"/>
<text x="700" y="640" text-anchor="middle" class="note">If verification fails, return to observation with the new evidence rather than stacking additional changes.</text>
</svg>