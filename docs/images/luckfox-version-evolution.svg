<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="v01" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  <linearGradient id="v02" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="v03" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="v05" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="v10" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
</defs>
<rect width="1500" height="760" rx="30" fill="url(#bg)"/>
<text id="title" x="750" y="58" text-anchor="middle" class="title">Version Evolution</text>
<text id="desc" x="750" y="88" text-anchor="middle" class="subtitle">Each version expands capability without sacrificing reproducibility</text>

<g filter="url(#shadow)">
  <rect x="70" y="160" width="240" height="420" rx="26" fill="url(#v01)"/>
  <text x="190" y="210" text-anchor="middle" class="box-title">v0.1</text>
  <text x="190" y="242" text-anchor="middle" class="box-sub">Foundation</text>
  <text x="110" y="300" class="box-sub">Ubuntu boot</text>
  <text x="110" y="335" class="box-sub">Ethernet and SSH</text>
  <text x="110" y="370" class="box-sub">Swap support</text>
  <text x="110" y="405" class="box-sub">Release pipeline</text>
  <text x="110" y="440" class="box-sub">Core docs</text>
</g>

<path d="M310 370 H350" class="connector"/>

<g filter="url(#shadow)">
  <rect x="350" y="160" width="240" height="420" rx="26" fill="url(#v02)"/>
  <text x="470" y="210" text-anchor="middle" class="box-title">v0.2</text>
  <text x="470" y="242" text-anchor="middle" class="box-sub">Quality</text>
  <text x="390" y="300" class="box-sub">Validation</text>
  <text x="390" y="335" class="box-sub">Cleaner logs</text>
  <text x="390" y="370" class="box-sub">RootFS resize</text>
  <text x="390" y="405" class="box-sub">Metadata checks</text>
  <text x="390" y="440" class="box-sub">Documentation polish</text>
</g>

<path d="M590 370 H630" class="connector"/>

<g filter="url(#shadow)">
  <rect x="630" y="160" width="240" height="420" rx="26" fill="url(#v03)"/>
  <text x="750" y="210" text-anchor="middle" class="box-title">v0.3</text>
  <text x="750" y="242" text-anchor="middle" class="box-sub">Hardware</text>
  <text x="670" y="300" class="box-sub">GPIO examples</text>
  <text x="670" y="335" class="box-sub">Camera support</text>
  <text x="670" y="370" class="box-sub">Board health tools</text>
  <text x="670" y="405" class="box-sub">Installer workflow</text>
</g>

<path d="M870 370 H910" class="connector"/>

<g filter="url(#shadow)">
  <rect x="910" y="160" width="240" height="420" rx="26" fill="url(#v05)"/>
  <text x="1030" y="210" text-anchor="middle" class="box-title">v0.5</text>
  <text x="1030" y="242" text-anchor="middle" class="box-sub">Automation</text>
  <text x="950" y="300" class="box-sub">CI builds</text>
  <text x="950" y="335" class="box-sub">Regression checks</text>
  <text x="950" y="370" class="box-sub">Release channels</text>
  <text x="950" y="405" class="box-sub">Artifact publishing</text>
</g>

<path d="M1150 370 H1190" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1190" y="160" width="240" height="420" rx="26" fill="url(#v10)"/>
  <text x="1310" y="210" text-anchor="middle" class="box-title">v1.0</text>
  <text x="1310" y="242" text-anchor="middle" class="box-sub">Stable</text>
  <text x="1230" y="300" class="box-sub">Verified images</text>
  <text x="1230" y="335" class="box-sub">Stable interfaces</text>
  <text x="1230" y="370" class="box-sub">Complete docs</text>
  <text x="1230" y="405" class="box-sub">Community process</text>
</g>

<g filter="url(#shadow)">
  <rect x="250" y="635" width="1000" height="70" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="750" y="678" text-anchor="middle" class="mono">capability grows · compatibility remains · recovery stays possible</text>
</g>
</svg>