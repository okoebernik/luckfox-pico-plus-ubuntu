<rect width="1500" height="700" rx="30" fill="url(#bg)"/><text x="750" y="58" text-anchor="middle" class="t">Release Roadmap</text><text x="750" y="88" text-anchor="middle" class="st">A future channel model from source changes to long-term support</text><g filter="url(#s)"><rect x="75" y="190" width="220" height="170" rx="24" fill="#475569"/><text x="185.0" y="235" text-anchor="middle" class="bt">Commit</text><text x="115" y="282" class="bs">Reviewed source</text><text x="115" y="313" class="bs">Focused branch</text><text x="115" y="344" class="bs">Test evidence</text></g><path d="M295 275 H355" class="c"/><g filter="url(#s)"><rect x="355" y="190" width="220" height="170" rx="24" fill="#0ea5e9"/><text x="465.0" y="235" text-anchor="middle" class="bt">Nightly</text><text x="395" y="282" class="bs">Automated build</text><text x="395" y="313" class="bs">Checksums</text><text x="395" y="344" class="bs">Developer testing</text></g><path d="M575 275 H635" class="c"/><g filter="url(#s)"><rect x="635" y="190" width="220" height="170" rx="24" fill="#7c3aed"/><text x="745.0" y="235" text-anchor="middle" class="bt">Release Candidate</text><text x="675" y="282" class="bs">Feature freeze</text><text x="675" y="313" class="bs">Hardware regression</text><text x="675" y="344" class="bs">Known limitations</text></g><path d="M855 275 H915" class="c"/><g filter="url(#s)"><rect x="915" y="190" width="220" height="170" rx="24" fill="#059669"/><text x="1025.0" y="235" text-anchor="middle" class="bt">Stable</text><text x="955" y="282" class="bs">Verified artifacts</text><text x="955" y="313" class="bs">Complete notes</text><text x="955" y="344" class="bs">Recommended release</text></g><path d="M1135 275 H1195" class="c"/><g filter="url(#s)"><rect x="1195" y="190" width="230" height="170" rx="24" fill="#f97316"/><text x="1310.0" y="235" text-anchor="middle" class="bt">Maintained Stable</text><text x="1235" y="282" class="bs">Security and critical fixes</text><text x="1235" y="313" class="bs">Compatibility policy</text><text x="1235" y="344" class="bs">Documented lifetime</text></g><rect x="165" y="440" width="1170" height="145" rx="24" fill="#fff" stroke="#cbd5e1"/><text x="205" y="482" style="font:700 15px Inter,Arial;fill:#0f172a">Promotion requirements</text><text x="205" y="522" class="n">Reproducible build · passing checksums · successful flash · UART boot · memory and network validation</text><text x="205" y="556" class="n">A release moves forward only when evidence exists for the exact published artifacts.</text><text x="750" y="645" text-anchor="middle" class="n">The channel model is a long-term goal and may be introduced incrementally.</text></svg>