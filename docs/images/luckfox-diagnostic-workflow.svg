<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="observe" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  <linearGradient id="collect" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="identify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="analyze" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="fix" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="610" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Diagnostic Workflow</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">A controlled method is faster than multiple speculative changes</text>

<g filter="url(#shadow)">
  <rect x="60" y="180" width="185" height="155" rx="22" fill="url(#observe)"/>
  <text x="152" y="222" text-anchor="middle" class="box-title">Observe</text>
  <text x="152" y="253" text-anchor="middle" class="box-sub">Exact symptom</text>
  <text x="152" y="280" text-anchor="middle" class="box-sub">Time and trigger</text>
</g>
<path d="M245 257 H290" class="connector"/>

<g filter="url(#shadow)">
  <rect x="290" y="180" width="185" height="155" rx="22" fill="url(#collect)"/>
  <text x="382" y="222" text-anchor="middle" class="box-title">Collect</text>
  <text x="382" y="253" text-anchor="middle" class="box-sub">UART · dmesg</text>
  <text x="382" y="280" text-anchor="middle" class="box-sub">journal · state</text>
</g>
<path d="M475 257 H520" class="connector"/>

<g filter="url(#shadow)">
  <rect x="520" y="180" width="185" height="155" rx="22" fill="url(#identify)"/>
  <text x="612" y="222" text-anchor="middle" class="box-title">Identify Layer</text>
  <text x="612" y="253" text-anchor="middle" class="box-sub">Highest working stage</text>
  <text x="612" y="280" text-anchor="middle" class="box-sub">First failed stage</text>
</g>
<path d="M705 257 H750" class="connector"/>

<g filter="url(#shadow)">
  <rect x="750" y="180" width="185" height="155" rx="22" fill="url(#analyze)"/>
  <text x="842" y="222" text-anchor="middle" class="box-title">Analyze</text>
  <text x="842" y="253" text-anchor="middle" class="box-sub">Compare evidence</text>
  <text x="842" y="280" text-anchor="middle" class="box-sub">Select one cause</text>
</g>
<path d="M935 257 H980" class="connector"/>

<g filter="url(#shadow)">
  <rect x="980" y="180" width="185" height="155" rx="22" fill="url(#fix)"/>
  <text x="1072" y="222" text-anchor="middle" class="box-title">Apply One Fix</text>
  <text x="1072" y="253" text-anchor="middle" class="box-sub">Keep rollback ready</text>
  <text x="1072" y="280" text-anchor="middle" class="box-sub">Document the change</text>
</g>
<path d="M1165 257 H1210" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1210" y="180" width="145" height="155" rx="22" fill="url(#verify)"/>
  <text x="1282" y="222" text-anchor="middle" class="box-title">Verify</text>
  <text x="1282" y="253" text-anchor="middle" class="box-sub">Reboot</text>
  <text x="1282" y="280" text-anchor="middle" class="box-sub">Retest all layers</text>
</g>

<g filter="url(#shadow)">
  <rect x="190" y="410" width="1020" height="110" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="230" y="447" class="label">Minimum evidence before a destructive recovery step</text>
  <text x="230" y="482" class="mono">UART log · release version · SHA256 result · free -h · swapon --show · dmesg · journalctl -b</text>
</g>

<text x="700" y="565" text-anchor="middle" class="note">Preserve evidence before rebooting, repairing or reflashing.</text>
</svg>