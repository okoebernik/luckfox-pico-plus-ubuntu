<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu diagnostic layers</title>
  <desc id="desc">Layered diagnostic model from hardware and BootROM through U-Boot, kernel, systemd, network, SSH and applications.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="l4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="l5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="l6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="l7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="l8" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
  </defs>

  <rect width="1100" height="850" rx="30" fill="url(#bg)"/>
  <text x="550" y="58" text-anchor="middle" class="title">Diagnostic Layers</text>
  <text x="550" y="88" text-anchor="middle" class="subtitle">Start at the bottom and move upward only after each layer is proven</text>

  <g filter="url(#shadow)">
    <rect x="185" y="135" width="730" height="70" rx="18" fill="url(#l8)"/>
    <text x="550" y="176" text-anchor="middle" class="box-title">Applications and User Workloads</text>
  </g>
  <path d="M550 205 V225" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="205" y="225" width="690" height="70" rx="18" fill="url(#l7)"/>
    <text x="550" y="266" text-anchor="middle" class="box-title">SSH and Login</text>
  </g>
  <path d="M550 295 V315" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="225" y="315" width="650" height="70" rx="18" fill="url(#l6)"/>
    <text x="550" y="356" text-anchor="middle" class="box-title">Network: Link · DHCP · Routing</text>
  </g>
  <path d="M550 385 V405" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="245" y="405" width="610" height="70" rx="18" fill="url(#l5)"/>
    <text x="550" y="446" text-anchor="middle" class="box-title">systemd and Ubuntu Userspace</text>
  </g>
  <path d="M550 475 V495" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="265" y="495" width="570" height="70" rx="18" fill="url(#l4)"/>
    <text x="550" y="536" text-anchor="middle" class="box-title">Linux Kernel and RootFS Mount</text>
  </g>
  <path d="M550 565 V585" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="285" y="585" width="530" height="70" rx="18" fill="url(#l3)"/>
    <text x="550" y="626" text-anchor="middle" class="box-title">U-Boot and boot.img</text>
  </g>
  <path d="M550 655 V675" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="305" y="675" width="490" height="70" rx="18" fill="url(#l2)"/>
    <text x="550" y="716" text-anchor="middle" class="box-title">BootROM and idblock</text>
  </g>
  <path d="M550 745 V765" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="325" y="765" width="450" height="60" rx="18" fill="url(#l1)"/>
    <text x="550" y="802" text-anchor="middle" class="box-title">Power · Board · microSD · UART</text>
  </g>
</svg>