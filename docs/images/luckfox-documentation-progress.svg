<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="done" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  <linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="planned" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
</defs>
<rect width="1500" height="800" rx="30" fill="url(#bg)"/>
<text id="title" x="750" y="58" text-anchor="middle" class="title">Documentation Progress</text>
<text id="desc" x="750" y="88" text-anchor="middle" class="subtitle">Core user and engineering guides are established; project expansion guides follow next</text>

<g filter="url(#shadow)">
  <rect x="75" y="145" width="410" height="505" rx="26" fill="url(#done)"/>
  <text x="280" y="195" text-anchor="middle" class="box-title">Complete</text>
  <text x="125" y="245" class="box-sub">✓ README</text>
  <text x="125" y="280" class="box-sub">✓ Introduction</text>
  <text x="125" y="315" class="box-sub">✓ Getting Started</text>
  <text x="125" y="350" class="box-sub">✓ Build System</text>
  <text x="125" y="385" class="box-sub">✓ Flashing</text>
  <text x="125" y="420" class="box-sub">✓ First Boot</text>
  <text x="125" y="455" class="box-sub">✓ Memory Optimization</text>
  <text x="125" y="490" class="box-sub">✓ Troubleshooting</text>
  <text x="125" y="525" class="box-sub">✓ Development</text>
</g>

<g filter="url(#shadow)">
  <rect x="545" y="145" width="410" height="505" rx="26" fill="url(#active)"/>
  <text x="750" y="195" text-anchor="middle" class="box-title">In Progress</text>
  <text x="595" y="245" class="box-sub">• Project Roadmap</text>
  <text x="595" y="280" class="box-sub">• Documentation index</text>
  <text x="595" y="315" class="box-sub">• Navigation consistency</text>
  <text x="595" y="350" class="box-sub">• SVG design alignment</text>
  <text x="595" y="385" class="box-sub">• Cross-document links</text>
</g>

<g filter="url(#shadow)">
  <rect x="1015" y="145" width="410" height="505" rx="26" fill="url(#planned)"/>
  <text x="1220" y="195" text-anchor="middle" class="box-title">Planned</text>
  <text x="1065" y="245" class="box-sub">○ FAQ</text>
  <text x="1065" y="280" class="box-sub">○ CONTRIBUTING.md</text>
  <text x="1065" y="315" class="box-sub">○ GPIO guide</text>
  <text x="1065" y="350" class="box-sub">○ Camera guide</text>
  <text x="1065" y="385" class="box-sub">○ Hardware validation guide</text>
  <text x="1065" y="420" class="box-sub">○ Release notes template</text>
</g>

<g filter="url(#shadow)">
  <rect x="220" y="700" width="1060" height="58" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="750" y="737" text-anchor="middle" class="mono">document the current system first · expand only with tested features</text>
</g>
</svg>