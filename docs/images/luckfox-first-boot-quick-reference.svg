<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu first boot quick reference</title>
  <desc id="desc">Quick reference showing microSD insertion, connection of UART and Ethernet, power on, boot observation, login, verification, root filesystem resize and password hardening.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="sd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="connect" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="power" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="login" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="resize" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
    <linearGradient id="secure" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  </defs>

  <rect width="1400" height="560" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">First Boot Quick Reference</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">From freshly flashed microSD card to a secured Ubuntu system</text>

  <g filter="url(#shadow)">
    <rect x="35" y="180" width="145" height="155" rx="22" fill="url(#sd)"/>
    <text x="107" y="220" text-anchor="middle" class="box-title">Insert SD</text>
    <text x="107" y="251" text-anchor="middle" class="box-sub">Use verified card</text>
    <text x="107" y="278" text-anchor="middle" class="box-sub">Board powered off</text>
  </g>
  <path d="M180 257 H215" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="215" y="180" width="145" height="155" rx="22" fill="url(#connect)"/>
    <text x="287" y="220" text-anchor="middle" class="box-title">Connect</text>
    <text x="287" y="251" text-anchor="middle" class="box-sub">UART2 + Ethernet</text>
    <text x="287" y="278" text-anchor="middle" class="box-sub">Open terminal</text>
  </g>
  <path d="M360 257 H395" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="395" y="180" width="145" height="155" rx="22" fill="url(#power)"/>
    <text x="467" y="220" text-anchor="middle" class="box-title">Power On</text>
    <text x="467" y="251" text-anchor="middle" class="box-sub">USB-C supply</text>
    <text x="467" y="278" text-anchor="middle" class="box-sub">Watch UART</text>
  </g>
  <path d="M540 257 H575" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="575" y="180" width="145" height="155" rx="22" fill="url(#boot)"/>
    <text x="647" y="220" text-anchor="middle" class="box-title">Observe Boot</text>
    <text x="647" y="251" text-anchor="middle" class="box-sub">Kernel + systemd</text>
    <text x="647" y="278" text-anchor="middle" class="box-sub">Swap activates</text>
  </g>
  <path d="M720 257 H755" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="755" y="180" width="145" height="155" rx="22" fill="url(#login)"/>
    <text x="827" y="220" text-anchor="middle" class="box-title">Login</text>
    <text x="827" y="251" text-anchor="middle" class="box-sub">UART or SSH</text>
    <text x="827" y="278" text-anchor="middle" class="box-sub">User: pico</text>
  </g>
  <path d="M900 257 H935" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="935" y="180" width="145" height="155" rx="22" fill="url(#verify)"/>
    <text x="1007" y="220" text-anchor="middle" class="box-title">Verify</text>
    <text x="1007" y="251" text-anchor="middle" class="box-sub">RAM · swap · DHCP</text>
    <text x="1007" y="278" text-anchor="middle" class="box-sub">Services healthy</text>
  </g>
  <path d="M1080 257 H1115" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1115" y="180" width="145" height="155" rx="22" fill="url(#resize)"/>
    <text x="1187" y="220" text-anchor="middle" class="box-title">Resize</text>
    <text x="1187" y="251" text-anchor="middle" class="box-sub">resize2fs</text>
    <text x="1187" y="278" text-anchor="middle" class="box-sub">Use full partition</text>
  </g>
  <path d="M1260 257 H1295" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1295" y="180" width="70" height="155" rx="22" fill="url(#secure)"/>
    <text x="1330" y="220" text-anchor="middle" class="box-title">Secure</text>
    <text x="1330" y="251" text-anchor="middle" class="box-sub">passwd</text>
    <text x="1330" y="278" text-anchor="middle" class="box-sub">Done</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="200" y="400" width="1000" height="80" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="245" y="430" class="note">Essential commands:</text>
    <text x="245" y="458" class="mono">free -h · swapon --show · ip address · sudo resize2fs /dev/mmcblk1p6 · passwd</text>
  </g>

  <text x="700" y="520" text-anchor="middle" class="note">Keep UART connected until login, swap and networking have all been confirmed.</text>
</svg>