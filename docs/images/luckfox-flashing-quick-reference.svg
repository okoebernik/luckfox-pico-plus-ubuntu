<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu flashing quick reference</title>
  <desc id="desc">Compact flashing quick reference showing build, verify, flash, boot, SSH, system verification and completion.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>

    <linearGradient id="build" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="ssh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="health" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <linearGradient id="done" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>

    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .step-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .step-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .number { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="520" rx="30" fill="url(#bg)"/>

  <text x="700" y="58" text-anchor="middle" class="title">Flashing Quick Reference</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">The complete workflow at a glance</text>

  <!-- Step numbers -->
  <g>
    <circle cx="110" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="110" y="148" text-anchor="middle" class="number">1</text>

    <circle cx="305" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="305" y="148" text-anchor="middle" class="number">2</text>

    <circle cx="500" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="500" y="148" text-anchor="middle" class="number">3</text>

    <circle cx="695" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="695" y="148" text-anchor="middle" class="number">4</text>

    <circle cx="890" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="890" y="148" text-anchor="middle" class="number">5</text>

    <circle cx="1085" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1085" y="148" text-anchor="middle" class="number">6</text>

    <circle cx="1280" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1280" y="148" text-anchor="middle" class="number">7</text>
  </g>

  <!-- Cards -->
  <g filter="url(#shadow)">
    <rect x="35" y="180" width="150" height="135" rx="22" fill="url(#build)"/>
    <text x="110" y="222" text-anchor="middle" class="step-title">Build</text>
    <text x="110" y="252" text-anchor="middle" class="step-sub">build-all.sh</text>
    <text x="110" y="277" text-anchor="middle" class="step-sub">Create release</text>
  </g>

  <path d="M185 248 H230" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="230" y="180" width="150" height="135" rx="22" fill="url(#verify)"/>
    <text x="305" y="222" text-anchor="middle" class="step-title">Verify</text>
    <text x="305" y="252" text-anchor="middle" class="step-sub">SHA256SUMS</text>
    <text x="305" y="277" text-anchor="middle" class="step-sub">All files OK</text>
  </g>

  <path d="M380 248 H425" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="425" y="180" width="150" height="135" rx="22" fill="url(#flash)"/>
    <text x="500" y="222" text-anchor="middle" class="step-title">Flash</text>
    <text x="500" y="252" text-anchor="middle" class="step-sub">SocToolKit</text>
    <text x="500" y="277" text-anchor="middle" class="step-sub">Create SD Card</text>
  </g>

  <path d="M575 248 H620" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="620" y="180" width="150" height="135" rx="22" fill="url(#boot)"/>
    <text x="695" y="222" text-anchor="middle" class="step-title">Boot</text>
    <text x="695" y="252" text-anchor="middle" class="step-sub">Insert microSD</text>
    <text x="695" y="277" text-anchor="middle" class="step-sub">Power board</text>
  </g>

  <path d="M770 248 H815" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="815" y="180" width="150" height="135" rx="22" fill="url(#ssh)"/>
    <text x="890" y="222" text-anchor="middle" class="step-title">Connect</text>
    <text x="890" y="252" text-anchor="middle" class="step-sub">UART or SSH</text>
    <text x="890" y="277" text-anchor="middle" class="step-sub">Login as pico</text>
  </g>

  <path d="M965 248 H1010" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1010" y="180" width="150" height="135" rx="22" fill="url(#health)"/>
    <text x="1085" y="222" text-anchor="middle" class="step-title">Check</text>
    <text x="1085" y="252" text-anchor="middle" class="step-sub">Swap · DHCP</text>
    <text x="1085" y="277" text-anchor="middle" class="step-sub">System health</text>
  </g>

  <path d="M1160 248 H1205" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1205" y="180" width="150" height="135" rx="22" fill="url(#done)"/>
    <text x="1280" y="222" text-anchor="middle" class="step-title">Done</text>
    <text x="1280" y="252" text-anchor="middle" class="step-sub">Resize rootfs</text>
    <text x="1280" y="277" text-anchor="middle" class="step-sub">Change password</text>
  </g>

  <!-- command row -->
  <g filter="url(#shadow)">
    <rect x="145" y="375" width="1110" height="72" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="185" y="405" class="note">Essential checks:</text>
    <text x="185" y="431" style="font:600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill:#334155;">sha256sum -c SHA256SUMS · swapon --show · ip address · sudo systemctl --failed</text>
  </g>

  <text x="700" y="485" text-anchor="middle" class="note">Use this diagram as the final checklist before considering a flash successful.</text>
</svg>