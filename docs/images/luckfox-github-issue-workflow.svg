<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="reproduce" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="collect" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="logs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="sanitize" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  <linearGradient id="submit" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="640" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">GitHub Issue Workflow</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">A complete report turns troubleshooting evidence into an actionable issue</text>

<g filter="url(#shadow)">
  <rect x="80" y="180" width="220" height="155" rx="22" fill="url(#reproduce)"/>
  <text x="190" y="222" text-anchor="middle" class="box-title">1 · Reproduce</text>
  <text x="190" y="253" text-anchor="middle" class="box-sub">Exact steps</text>
  <text x="190" y="280" text-anchor="middle" class="box-sub">Expected vs actual</text>
</g>
<path d="M300 257 H365" class="connector"/>

<g filter="url(#shadow)">
  <rect x="365" y="180" width="220" height="155" rx="22" fill="url(#collect)"/>
  <text x="475" y="222" text-anchor="middle" class="box-title">2 · Collect State</text>
  <text x="475" y="253" text-anchor="middle" class="box-sub">Board · commit</text>
  <text x="475" y="280" text-anchor="middle" class="box-sub">Memory · storage · network</text>
</g>
<path d="M585 257 H650" class="connector"/>

<g filter="url(#shadow)">
  <rect x="650" y="180" width="220" height="155" rx="22" fill="url(#logs)"/>
  <text x="760" y="222" text-anchor="middle" class="box-title">3 · Capture Logs</text>
  <text x="760" y="253" text-anchor="middle" class="box-sub">UART · dmesg</text>
  <text x="760" y="280" text-anchor="middle" class="box-sub">journalctl -b</text>
</g>
<path d="M870 257 H935" class="connector"/>

<g filter="url(#shadow)">
  <rect x="935" y="180" width="220" height="155" rx="22" fill="url(#sanitize)"/>
  <text x="1045" y="222" text-anchor="middle" class="box-title">4 · Sanitize</text>
  <text x="1045" y="253" text-anchor="middle" class="box-sub">Remove secrets</text>
  <text x="1045" y="280" text-anchor="middle" class="box-sub">Keep technical context</text>
</g>
<path d="M1155 257 H1215" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1215" y="180" width="140" height="155" rx="22" fill="url(#submit)"/>
  <text x="1285" y="222" text-anchor="middle" class="box-title">5 · Submit</text>
  <text x="1285" y="253" text-anchor="middle" class="box-sub">Issue template</text>
  <text x="1285" y="280" text-anchor="middle" class="box-sub">Follow up</text>
</g>

<g filter="url(#shadow)">
  <rect x="155" y="410" width="1090" height="140" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="195" y="452" class="label">Minimum issue content</text>
  <text x="195" y="492" class="note">Board model · project version · Git commit · build host · SD card · exact reproduction</text>
  <text x="195" y="524" class="note">Complete UART output · diagnostic bundle · changes made since flashing</text>
</g>

<text x="700" y="600" text-anchor="middle" class="note">Attach logs as text whenever possible so they remain searchable and reviewable.</text>
</svg>