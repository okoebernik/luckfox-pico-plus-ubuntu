<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu memory optimization pipeline</title>
  <desc id="desc">Optimization pipeline showing measurement, timer reduction, logging reduction, swap enablement, system tuning and verification.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.9); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="measure" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="timers" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="logging" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="swap" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="tune" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/></linearGradient>
  </defs>

  <rect width="1400" height="560" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Memory Optimization Pipeline</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">Reduce background pressure before adding application workloads</text>

  <g filter="url(#shadow)">
    <rect x="45" y="180" width="180" height="165" rx="22" fill="url(#measure)"/>
    <text x="135" y="220" text-anchor="middle" class="box-title">Measure</text>
    <text x="135" y="252" text-anchor="middle" class="box-sub">free · ps · dmesg</text>
    <text x="135" y="280" text-anchor="middle" class="box-sub">Find pressure sources</text>
  </g>
  <path d="M225 262 H275" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="275" y="180" width="180" height="165" rx="22" fill="url(#timers)"/>
    <text x="365" y="220" text-anchor="middle" class="box-title">Disable Timers</text>
    <text x="365" y="252" text-anchor="middle" class="box-sub">apt · scrub · motd</text>
    <text x="365" y="280" text-anchor="middle" class="box-sub">Avoid load spikes</text>
  </g>
  <path d="M455 262 H505" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="505" y="180" width="180" height="165" rx="22" fill="url(#logging)"/>
    <text x="595" y="220" text-anchor="middle" class="box-title">Reduce Logging</text>
    <text x="595" y="252" text-anchor="middle" class="box-sub">Volatile journal</text>
    <text x="595" y="280" text-anchor="middle" class="box-sub">Limit RAM and writes</text>
  </g>
  <path d="M685 262 H735" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="735" y="180" width="180" height="165" rx="22" fill="url(#swap)"/>
    <text x="825" y="220" text-anchor="middle" class="box-title">Enable Swap</text>
    <text x="825" y="252" text-anchor="middle" class="box-sub">512 MiB swapfile</text>
    <text x="825" y="280" text-anchor="middle" class="box-sub">Prevent login OOM</text>
  </g>
  <path d="M915 262 H965" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="965" y="180" width="180" height="165" rx="22" fill="url(#tune)"/>
    <text x="1055" y="220" text-anchor="middle" class="box-title">Tune VM</text>
    <text x="1055" y="252" text-anchor="middle" class="box-sub">swappiness = 100</text>
    <text x="1055" y="280" text-anchor="middle" class="box-sub">cache pressure = 200</text>
  </g>
  <path d="M1145 262 H1195" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1195" y="180" width="160" height="165" rx="22" fill="url(#verify)"/>
    <text x="1275" y="220" text-anchor="middle" class="box-title">Verify</text>
    <text x="1275" y="252" text-anchor="middle" class="box-sub">Stable login</text>
    <text x="1275" y="280" text-anchor="middle" class="box-sub">No new OOM events</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="220" y="405" width="960" height="76" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="260" y="435" class="note">Optimization philosophy:</text>
    <text x="260" y="461" class="mono">stability → reproducibility → maintainability → performance</text>
  </g>

  <text x="700" y="520" text-anchor="middle" class="note">The goal is not maximum minimalism; it is predictable Ubuntu operation on constrained hardware.</text>
</svg>