<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="host" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  <linearGradient id="linux" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="tools" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="sdk" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="project" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="700" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Development Environment</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">A consistent Linux toolchain keeps builds reproducible</text>

<g filter="url(#shadow)">
  <rect x="75" y="165" width="250" height="170" rx="24" fill="url(#host)"/>
  <text x="200" y="210" text-anchor="middle" class="box-title">Developer Host</text>
  <text x="200" y="244" text-anchor="middle" class="box-sub">Windows 11 + WSL2</text>
  <text x="200" y="272" text-anchor="middle" class="box-sub">or native Ubuntu</text>
  <text x="200" y="300" text-anchor="middle" class="box-sub">Git + editor</text>
</g>
<path d="M325 250 H385" class="connector"/>

<g filter="url(#shadow)">
  <rect x="385" y="165" width="250" height="170" rx="24" fill="url(#linux)"/>
  <text x="510" y="210" text-anchor="middle" class="box-title">Ubuntu 22.04</text>
  <text x="510" y="244" text-anchor="middle" class="box-sub">Native Linux filesystem</text>
  <text x="510" y="272" text-anchor="middle" class="box-sub">Stable package base</text>
  <text x="510" y="300" text-anchor="middle" class="box-sub">Clean PATH</text>
</g>
<path d="M635 250 H695" class="connector"/>

<g filter="url(#shadow)">
  <rect x="695" y="165" width="250" height="170" rx="24" fill="url(#tools)"/>
  <text x="820" y="210" text-anchor="middle" class="box-title">Build Tooling</text>
  <text x="820" y="244" text-anchor="middle" class="box-sub">Git · Python · Make</text>
  <text x="820" y="272" text-anchor="middle" class="box-sub">QEMU · debootstrap</text>
  <text x="820" y="300" text-anchor="middle" class="box-sub">Rockchip tools</text>
</g>
<path d="M945 250 H1005" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1005" y="165" width="250" height="170" rx="24" fill="url(#sdk)"/>
  <text x="1130" y="210" text-anchor="middle" class="box-title">Official SDK</text>
  <text x="1130" y="244" text-anchor="middle" class="box-sub">Kernel · U-Boot</text>
  <text x="1130" y="272" text-anchor="middle" class="box-sub">Device Tree · drivers</text>
  <text x="1130" y="300" text-anchor="middle" class="box-sub">Firmware assets</text>
</g>

<path d="M1130 335 V385 H700" class="connector"/>

<g filter="url(#shadow)">
  <rect x="470" y="390" width="460" height="150" rx="24" fill="url(#project)"/>
  <text x="700" y="435" text-anchor="middle" class="box-title">luckfox-pico-plus-ubuntu</text>
  <text x="700" y="470" text-anchor="middle" class="box-sub">Scripts · configuration · docs</text>
  <text x="700" y="498" text-anchor="middle" class="box-sub">Generated RootFS and release images</text>
</g>

<g filter="url(#shadow)">
  <rect x="230" y="590" width="940" height="66" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="270" y="617" class="note">Recommended location:</text>
  <text x="450" y="617" class="mono">~/projects/luckfox-pico-plus-ubuntu</text>
  <text x="270" y="642" class="note">Avoid building under `/mnt/c/...` in WSL2.</text>
</g>
</svg>