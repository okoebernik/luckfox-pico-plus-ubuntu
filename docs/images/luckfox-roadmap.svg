<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
 <linearGradient id="done" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
 <linearGradient id="next" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
 <linearGradient id="future" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
</defs>
<rect width="1400" height="620" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Project Roadmap</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">From the first bootable image to a stable community release</text>

<line x1="175" y1="325" x2="1225" y2="325" stroke="#94a3b8" stroke-width="6"/>

<g filter="url(#shadow)">
 <circle cx="255" cy="325" r="34" fill="#059669"/>
 <text x="255" y="332" text-anchor="middle" style="font:700 19px Inter,Arial;fill:#fff;">✓</text>
 <rect x="95" y="145" width="320" height="135" rx="22" fill="url(#done)"/>
 <text x="255" y="188" text-anchor="middle" class="box-title">v0.1 · Foundation</text>
 <text x="135" y="225" class="box-sub">Ubuntu boot · Ethernet · SSH</text>
 <text x="135" y="252" class="box-sub">Build and release pipeline</text>
</g>

<g filter="url(#shadow)">
 <circle cx="700" cy="325" r="34" fill="#2563eb"/>
 <text x="700" y="332" text-anchor="middle" style="font:700 16px Inter,Arial;fill:#fff;">0.2</text>
 <rect x="540" y="370" width="320" height="150" rx="22" fill="url(#next)"/>
 <text x="700" y="414" text-anchor="middle" class="box-title">v0.2 · Hardware</text>
 <text x="580" y="451" class="box-sub">GPIO helpers · camera support</text>
 <text x="580" y="478" class="box-sub">Automatic filesystem resize</text>
</g>

<g filter="url(#shadow)">
 <circle cx="1145" cy="325" r="34" fill="#7c3aed"/>
 <text x="1145" y="332" text-anchor="middle" style="font:700 16px Inter,Arial;fill:#fff;">1.0</text>
 <rect x="985" y="145" width="320" height="155" rx="22" fill="url(#future)"/>
 <text x="1145" y="188" text-anchor="middle" class="box-title">v1.0 · Stable</text>
 <text x="1025" y="225" class="box-sub">CI builds · automated tests</text>
 <text x="1025" y="252" class="box-sub">Complete documentation</text>
 <text x="1025" y="279" class="box-sub">Stable public release</text>
</g>
</svg>