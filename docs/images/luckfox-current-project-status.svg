<rect width="1500" height="760" rx="30" fill="url(#bg)"/><text x="750" y="58" text-anchor="middle" class="t">Current Project Status</text><text x="750" y="88" text-anchor="middle" class="st">Completed foundations, active work and planned capabilities</text><g filter="url(#s)"><rect x="70" y="145" width="410" height="220" rx="24" fill="#059669"/><text x="275.0" y="190" text-anchor="middle" class="bt">Complete</text><text x="110" y="237" class="bs">✓ Ubuntu 22.04 RootFS</text><text x="110" y="268" class="bs">✓ Ethernet and SSH</text><text x="110" y="299" class="bs">✓ Release packaging</text><text x="110" y="330" class="bs">✓ Core documentation</text></g><g filter="url(#s)"><rect x="545" y="145" width="410" height="220" rx="24" fill="#2563eb"/><text x="750.0" y="190" text-anchor="middle" class="bt">In Progress</text><text x="585" y="237" class="bs">• Build validation</text><text x="585" y="268" class="bs">• Better diagnostics</text><text x="585" y="299" class="bs">• Automatic resizing</text><text x="585" y="330" class="bs">• Roadmap and project polish</text></g><g filter="url(#s)"><rect x="1020" y="145" width="410" height="220" rx="24" fill="#7c3aed"/><text x="1225.0" y="190" text-anchor="middle" class="bt">Planned</text><text x="1060" y="237" class="bs">○ GPIO and camera guides</text><text x="1060" y="268" class="bs">○ CI and automated tests</text><text x="1060" y="299" class="bs">○ Installer and recovery tools</text><text x="1060" y="330" class="bs">○ Stable v1.0 release</text></g><rect x="120" y="455" width="1260" height="165" rx="26" fill="#fff" stroke="#cbd5e1"/><text x="165" y="500" style="font:700 15px Inter,Arial;fill:#0f172a">Priority order</text><text x="165" y="542" class="m">reliability → reproducibility → hardware enablement → automation → community release</text><text x="165" y="580" class="n">Features are promoted only after they can be rebuilt, tested and documented consistently.</text></svg>