chor="middle" class="bt">v0.5 · Automation</text><text x="905" y="497" class="bs">CI builds</text><text x="905" y="528" class="bs">Regression verification</text><text x="905" y="559" class="bs">Release automation</text></g><circle cx="1020" cy="350" r="36" fill="#7c3aed"/><text x="1020" y="357" text-anchor="middle" style="font:700 16px Inter,Arial;fill:white">0.5</text><g filter="url(#s)"><rect x="1135" y="135" width="310" height="165" rx="24" fill="#475569"/><text x="1290.0" y="180" text-anchor="middle" class="bt">v1.0 · Stable</text><text x="1175" y="227" class="bs">Verified images</text><text x="1175" y="258" class="bs">Complete documentation</text><text x="1175" y="289" class="bs">Community-ready release</text></g><circle cx="1290" cy="350" r="36" fill="#475569"/><text x="1290" y="357" text-anchor="middle" style="font:700 16px Inter,Arial;fill:white">1.0</text><rect x="255" y="640" width="990" height="72" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="750" y="684" text-anchor="middle" class="m">foundation → quality → hardware → automation → stable release</text></svg>