<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu recovery decision tree</title>
  <desc id="desc">Decision tree for power, UART, kernel, login and SSH failures leading to the appropriate recovery action.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <defs>
    <linearGradient id="start" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="question" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="fix" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  </defs>

  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Recovery Decision Tree</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">Always follow the first failing layer instead of jumping ahead</text>

  <g filter="url(#shadow)">
    <rect x="570" y="125" width="260" height="90" rx="24" fill="url(#start)"/>
    <text x="700" y="165" text-anchor="middle" class="box-title">Problem Reported</text>
    <text x="700" y="192" text-anchor="middle" class="box-sub">Start with observable facts</text>
  </g>
  <path d="M700 215 V255" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="570" y="255" width="260" height="90" rx="24" fill="url(#question)"/>
    <text x="700" y="295" text-anchor="middle" class="box-title">Power Present?</text>
    <text x="700" y="322" text-anchor="middle" class="box-sub">LEDs / current draw</text>
  </g>

  <path d="M570 300 H335" class="connector-soft"/>
  <g filter="url(#shadow)">
    <rect x="85" y="255" width="250" height="90" rx="22" fill="url(#warn)"/>
    <text x="210" y="294" text-anchor="middle" class="box-title">No Power</text>
    <text x="210" y="321" text-anchor="middle" class="box-sub">Cable · supply · connector</text>
  </g>

  <path d="M700 345 V390" class="connector"/>
  <g filter="url(#shadow)">
    <rect x="570" y="390" width="260" height="90" rx="24" fill="url(#question)"/>
    <text x="700" y="430" text-anchor="middle" class="box-title">UART Output?</text>
    <text x="700" y="457" text-anchor="middle" class="box-sub">UART2 · 115200 8N1</text>
  </g>

  <path d="M570 435 H335" class="connector-soft"/>
  <g filter="url(#shadow)">
    <rect x="85" y="390" width="250" height="90" rx="22" fill="url(#fix)"/>
    <text x="210" y="429" text-anchor="middle" class="box-title">Check UART</text>
    <text x="210" y="456" text-anchor="middle" class="box-sub">Pins · GND · adapter · baud</text>
  </g>

  <path d="M700 480 V525" class="connector"/>
  <g filter="url(#shadow)">
    <rect x="570" y="525" width="260" height="90" rx="24" fill="url(#question)"/>
    <text x="700" y="565" text-anchor="middle" class="box-title">Kernel Starts?</text>
    <text x="700" y="592" text-anchor="middle" class="box-sub">"Starting kernel ..."</text>
  </g>

  <path d="M570 570 H335" class="connector-soft"/>
  <g filter="url(#shadow)">
    <rect x="85" y="525" width="250" height="90" rx="22" fill="url(#fix)"/>
    <text x="210" y="564" text-anchor="middle" class="box-title">Boot Image Recovery</text>
    <text x="210" y="591" text-anchor="middle" class="box-sub">idblock · U-Boot · boot.img</text>
  </g>

  <path d="M700 615 V660" class="connector"/>
  <g filter="url(#shadow)">
    <rect x="570" y="660" width="260" height="90" rx="24" fill="url(#question)"/>
    <text x="700" y="700" text-anchor="middle" class="box-title">Login Prompt?</text>
    <text x="700" y="727" text-anchor="middle" class="box-sub">systemd reaches getty</text>
  </g>

  <path d="M570 705 H335" class="connector-soft"/>
  <g filter="url(#shadow)">
    <rect x="85" y="660" width="250" height="90" rx="22" fill="url(#fix)"/>
    <text x="210" y="699" text-anchor="middle" class="box-title">Userspace Recovery</text>
    <text x="210" y="726" text-anchor="middle" class="box-sub">rootfs · systemd · swap · OOM</text>
  </g>

  <path d="M830 705 H1065" class="connector-soft"/>
  <g filter="url(#shadow)">
    <rect x="1065" y="660" width="250" height="90" rx="22" fill="url(#question)"/>
    <text x="1190" y="699" text-anchor="middle" class="box-title">SSH Works?</text>
    <text x="1190" y="726" text-anchor="middle" class="box-sub">DHCP · route · port 22</text>
  </g>

  <path d="M1190 750 V790" class="connector"/>
  <g filter="url(#shadow)">
    <rect x="1065" y="790" width="250" height="72" rx="22" fill="url(#ok)"/>
    <text x="1190" y="832" text-anchor="middle" class="box-title">System Recovered</text>
  </g>

  <path d="M1065 705 H940" class="connector-soft"/>
  <g filter="url(#shadow)">
    <rect x="835" y="665" width="190" height="80" rx="22" fill="url(#fix)"/>
    <text x="930" y="700" text-anchor="middle" class="box-title">Network / SSH</text>
    <text x="930" y="727" text-anchor="middle" class="box-sub">ip · ss · systemctl</text>
  </g>

  <text x="700" y="875" text-anchor="middle" class="note">A successful lower layer eliminates many higher-layer causes.</text>
</svg>