<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="panic" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
  <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="cmd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="root" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="recover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="760" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Kernel Panic Diagnosis</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Preserve the complete UART log before changing any image</text>

<g filter="url(#shadow)">
  <rect x="70" y="175" width="240" height="145" rx="22" fill="url(#panic)"/>
  <text x="190" y="217" text-anchor="middle" class="box-title">Kernel Panic</text>
  <text x="190" y="248" text-anchor="middle" class="box-sub">Unable to mount root fs</text>
  <text x="190" y="275" text-anchor="middle" class="box-sub">or fatal kernel error</text>
</g>
<path d="M310 247 H370" class="connector"/>

<g filter="url(#shadow)">
  <rect x="370" y="175" width="240" height="145" rx="22" fill="url(#boot)"/>
  <text x="490" y="217" text-anchor="middle" class="box-title">Verify boot.img</text>
  <text x="490" y="248" text-anchor="middle" class="box-sub">Kernel + Device Tree</text>
  <text x="490" y="275" text-anchor="middle" class="box-sub">SHA256 and release match</text>
</g>
<path d="M610 247 H670" class="connector"/>

<g filter="url(#shadow)">
  <rect x="670" y="175" width="240" height="145" rx="22" fill="url(#cmd)"/>
  <text x="790" y="217" text-anchor="middle" class="box-title">Inspect cmdline</text>
  <text x="790" y="248" text-anchor="middle" class="box-sub">root= · console=</text>
  <text x="790" y="275" text-anchor="middle" class="box-sub">Correct partition target</text>
</g>
<path d="M910 247 H970" class="connector"/>

<g filter="url(#shadow)">
  <rect x="970" y="175" width="240" height="145" rx="22" fill="url(#root)"/>
  <text x="1090" y="217" text-anchor="middle" class="box-title">Check RootFS</text>
  <text x="1090" y="248" text-anchor="middle" class="box-sub">ext4 integrity</text>
  <text x="1090" y="275" text-anchor="middle" class="box-sub">Expected p6 layout</text>
</g>
<path d="M1210 247 H1260" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1260" y="175" width="95" height="145" rx="22" fill="url(#recover)"/>
  <text x="1307" y="217" text-anchor="middle" class="box-title">Recover</text>
  <text x="1307" y="248" text-anchor="middle" class="box-sub">Reflash</text>
  <text x="1307" y="275" text-anchor="middle" class="box-sub">Retest</text>
</g>

<g filter="url(#shadow)">
  <rect x="100" y="405" width="550" height="220" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="140" y="447" class="label">Evidence to collect</text>
  <text x="140" y="487" class="mono">Complete UART log</text>
  <text x="140" y="519" class="mono">cat /proc/cmdline</text>
  <text x="140" y="551" class="mono">sha256sum -c SHA256SUMS</text>
  <text x="140" y="583" class="mono">lsblk -f</text>
</g>

<g filter="url(#shadow)">
  <rect x="750" y="405" width="550" height="220" rx="24" fill="#fff7ed" stroke="#fdba74"/>
  <text x="790" y="447" class="label">Interpretation</text>
  <text x="790" y="487" class="note">• Panic before root mount: boot or cmdline issue</text>
  <text x="790" y="519" class="note">• ext4 errors: damaged rootfs or SD card</text>
  <text x="790" y="551" class="note">• module mismatch: wrong kernel release</text>
  <text x="790" y="583" class="note">• repeated reboot: capture the earliest panic</text>
</g>

<text x="700" y="690" text-anchor="middle" class="note">Do not trim the UART log; the real cause often appears before the final panic line.</text>
</svg>