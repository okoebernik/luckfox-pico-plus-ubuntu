<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
 <linearGradient id="ubuntu" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
 <linearGradient id="sdk" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
 <linearGradient id="build" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
 <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="640" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Project Highlights</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">The strengths of a full Ubuntu userspace without replacing the vendor BSP</text>

<g filter="url(#shadow)">
 <rect x="70" y="145" width="290" height="390" rx="26" fill="url(#ubuntu)"/>
 <text x="215" y="195" text-anchor="middle" class="box-title">Ubuntu Userspace</text>
 <text x="120" y="250" class="box-sub">✓ Ubuntu 22.04 LTS</text>
 <text x="120" y="290" class="box-sub">✓ apt package manager</text>
 <text x="120" y="330" class="box-sub">✓ OpenSSH server</text>
 <text x="120" y="370" class="box-sub">✓ systemd services</text>
 <text x="120" y="410" class="box-sub">✓ Familiar Linux tools</text>
 <text x="120" y="450" class="box-sub">✓ ARMHF compatibility</text>
</g>

<g filter="url(#shadow)">
 <rect x="390" y="145" width="290" height="390" rx="26" fill="url(#sdk)"/>
 <text x="535" y="195" text-anchor="middle" class="box-title">Official Luckfox SDK</text>
 <text x="440" y="250" class="box-sub">✓ U-Boot bootloader</text>
 <text x="440" y="290" class="box-sub">✓ Linux 5.10.160</text>
 <text x="440" y="330" class="box-sub">✓ Device Tree</text>
 <text x="440" y="370" class="box-sub">✓ Board drivers</text>
 <text x="440" y="410" class="box-sub">✓ Rockchip tooling</text>
 <text x="440" y="450" class="box-sub">✓ Pico Plus support</text>
</g>

<g filter="url(#shadow)">
 <rect x="710" y="145" width="290" height="390" rx="26" fill="url(#build)"/>
 <text x="855" y="195" text-anchor="middle" class="box-title">Automated Build</text>
 <text x="760" y="250" class="box-sub">✓ One-command pipeline</text>
 <text x="760" y="290" class="box-sub">✓ RootFS generation</text>
 <text x="760" y="330" class="box-sub">✓ Kernel modules</text>
 <text x="760" y="370" class="box-sub">✓ Release packaging</text>
 <text x="760" y="410" class="box-sub">✓ SHA-256 checksums</text>
 <text x="760" y="450" class="box-sub">✓ Reproducible output</text>
</g>

<g filter="url(#shadow)">
 <rect x="1030" y="145" width="300" height="390" rx="26" fill="url(#memory)"/>
 <text x="1180" y="195" text-anchor="middle" class="box-title">Low-Memory Engineering</text>
 <text x="1080" y="250" class="box-sub">✓ 512 MiB swapfile</text>
 <text x="1080" y="290" class="box-sub">✓ Reduced timers</text>
 <text x="1080" y="330" class="box-sub">✓ Volatile journald</text>
 <text x="1080" y="370" class="box-sub">✓ systemd tuning</text>
 <text x="1080" y="410" class="box-sub">✓ OOM diagnostics</text>
 <text x="1080" y="450" class="box-sub">✓ Runtime monitoring</text>
</g>
<text x="700" y="590" text-anchor="middle" class="note">Designed for experimentation, embedded development, IoT and lightweight network services.</text>
</svg>