<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="symptom" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
  <linearGradient id="measure" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  <linearGradient id="swap" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  <linearGradient id="process" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="reduce" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="verify" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
</defs>
<rect width="1400" height="760" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Memory and OOM Diagnostics</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Login failures and terminated services are often memory-pressure symptoms</text>

<g filter="url(#shadow)">
  <rect x="45" y="180" width="185" height="160" rx="22" fill="url(#symptom)"/>
  <text x="137" y="222" text-anchor="middle" class="box-title">Symptom</text>
  <text x="137" y="253" text-anchor="middle" class="box-sub">Killed process</text>
  <text x="137" y="280" text-anchor="middle" class="box-sub">SSH closes</text>
  <text x="137" y="307" text-anchor="middle" class="box-sub">apt fails</text>
</g>
<path d="M230 260 H275" class="connector"/>

<g filter="url(#shadow)">
  <rect x="275" y="180" width="185" height="160" rx="22" fill="url(#measure)"/>
  <text x="367" y="222" text-anchor="middle" class="box-title">Measure RAM</text>
  <text x="367" y="253" text-anchor="middle" class="box-sub">free -h</text>
  <text x="367" y="280" text-anchor="middle" class="box-sub">available memory</text>
</g>
<path d="M460 260 H505" class="connector"/>

<g filter="url(#shadow)">
  <rect x="505" y="180" width="185" height="160" rx="22" fill="url(#swap)"/>
  <text x="597" y="222" text-anchor="middle" class="box-title">Verify Swap</text>
  <text x="597" y="253" text-anchor="middle" class="box-sub">swapon --show</text>
  <text x="597" y="280" text-anchor="middle" class="box-sub">Expect ~512 MiB</text>
</g>
<path d="M690 260 H735" class="connector"/>

<g filter="url(#shadow)">
  <rect x="735" y="180" width="185" height="160" rx="22" fill="url(#process)"/>
  <text x="827" y="222" text-anchor="middle" class="box-title">Find Consumers</text>
  <text x="827" y="253" text-anchor="middle" class="box-sub">ps --sort=-rss</text>
  <text x="827" y="280" text-anchor="middle" class="box-sub">vmstat 1</text>
</g>
<path d="M920 260 H965" class="connector"/>

<g filter="url(#shadow)">
  <rect x="965" y="180" width="185" height="160" rx="22" fill="url(#reduce)"/>
  <text x="1057" y="222" text-anchor="middle" class="box-title">Reduce Load</text>
  <text x="1057" y="253" text-anchor="middle" class="box-sub">Stop one service</text>
  <text x="1057" y="280" text-anchor="middle" class="box-sub">Retry one task</text>
</g>
<path d="M1150 260 H1195" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1195" y="180" width="160" height="160" rx="22" fill="url(#verify)"/>
  <text x="1275" y="222" text-anchor="middle" class="box-title">Verify</text>
  <text x="1275" y="253" text-anchor="middle" class="box-sub">No new OOM</text>
  <text x="1275" y="280" text-anchor="middle" class="box-sub">Stable login</text>
</g>

<g filter="url(#shadow)">
  <rect x="100" y="420" width="560" height="210" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="140" y="462" class="label">Core commands</text>
  <text x="140" y="502" class="mono">free -h</text>
  <text x="140" y="534" class="mono">swapon --show</text>
  <text x="140" y="566" class="mono">ps aux --sort=-rss | head -15</text>
  <text x="140" y="598" class="mono">dmesg | grep -i -E 'oom|killed'</text>
</g>

<g filter="url(#shadow)">
  <rect x="760" y="420" width="540" height="210" rx="24" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="800" y="462" class="label">Healthy recovery</text>
  <text x="800" y="502" class="note">• Swap remains active after reboot</text>
  <text x="800" y="534" class="note">• Login and SSH stay responsive</text>
  <text x="800" y="566" class="note">• No new OOM-killer entries appear</text>
  <text x="800" y="598" class="note">• Swap growth stabilizes</text>
</g>

<text x="700" y="690" text-anchor="middle" class="note">Do not repeatedly retry a failed login without checking the UART kernel messages.</text>
</svg>