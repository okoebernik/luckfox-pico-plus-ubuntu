<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="detect" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
  <linearGradient id="layout" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="logs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="repair" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="replace" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
</defs>
<rect width="1400" height="760" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">microSD Card Diagnostics</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Treat I/O errors, read-only remounts and recurring corruption as media warnings</text>

<g filter="url(#shadow)">
  <rect x="70" y="180" width="220" height="155" rx="22" fill="url(#detect)"/>
  <text x="180" y="222" text-anchor="middle" class="box-title">1 · Detect</text>
  <text x="180" y="253" text-anchor="middle" class="box-sub">I/O errors</text>
  <text x="180" y="280" text-anchor="middle" class="box-sub">Read-only remount</text>
</g>
<path d="M290 257 H345" class="connector"/>

<g filter="url(#shadow)">
  <rect x="345" y="180" width="220" height="155" rx="22" fill="url(#layout)"/>
  <text x="455" y="222" text-anchor="middle" class="box-title">2 · Inspect Layout</text>
  <text x="455" y="253" text-anchor="middle" class="box-sub">lsblk -f · blkid</text>
  <text x="455" y="280" text-anchor="middle" class="box-sub">findmnt · df -h</text>
</g>
<path d="M565 257 H620" class="connector"/>

<g filter="url(#shadow)">
  <rect x="620" y="180" width="220" height="155" rx="22" fill="url(#logs)"/>
  <text x="730" y="222" text-anchor="middle" class="box-title">3 · Check Logs</text>
  <text x="730" y="253" text-anchor="middle" class="box-sub">mmc · ext4 · I/O</text>
  <text x="730" y="280" text-anchor="middle" class="box-sub">dmesg evidence</text>
</g>
<path d="M840 257 H895" class="connector"/>

<g filter="url(#shadow)">
  <rect x="895" y="180" width="220" height="155" rx="22" fill="url(#repair)"/>
  <text x="1005" y="222" text-anchor="middle" class="box-title">4 · Offline Repair</text>
  <text x="1005" y="253" text-anchor="middle" class="box-sub">Unmount filesystem</text>
  <text x="1005" y="280" text-anchor="middle" class="box-sub">fsck.ext4 -f</text>
</g>
<path d="M1115 257 H1170" class="connector"/>

<g filter="url(#shadow)">
  <rect x="1170" y="180" width="180" height="155" rx="22" fill="url(#replace)"/>
  <text x="1260" y="222" text-anchor="middle" class="box-title">5 · Replace</text>
  <text x="1260" y="253" text-anchor="middle" class="box-sub">If errors return</text>
  <text x="1260" y="280" text-anchor="middle" class="box-sub">Use known-good card</text>
</g>

<g filter="url(#shadow)">
  <rect x="95" y="420" width="570" height="215" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="135" y="462" class="label">On-board checks</text>
  <text x="135" y="502" class="mono">lsblk -f</text>
  <text x="135" y="534" class="mono">findmnt -no SOURCE,OPTIONS /</text>
  <text x="135" y="566" class="mono">df -h &amp;&amp; df -i</text>
  <text x="135" y="598" class="mono">dmesg | grep -i -E 'mmc|ext4|i/o|read-only'</text>
</g>

<g filter="url(#shadow)">
  <rect x="735" y="420" width="570" height="215" rx="24" fill="#fff7ed" stroke="#fdba74"/>
  <text x="775" y="462" class="label">Replacement indicators</text>
  <text x="775" y="502" class="note">• Repeated filesystem corruption</text>
  <text x="775" y="534" class="note">• New I/O errors after a clean flash</text>
  <text x="775" y="566" class="note">• Unexpected capacity or speed</text>
  <text x="775" y="598" class="note">• Card becomes permanently read-only</text>
</g>

<text x="700" y="695" text-anchor="middle" class="note">A filesystem repair can restore consistency but cannot repair failing flash memory.</text>
</svg>