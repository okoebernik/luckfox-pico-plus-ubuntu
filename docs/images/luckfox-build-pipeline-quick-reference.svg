<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Luckfox Ubuntu build pipeline quick reference</title>
  <desc id="desc">Compact build pipeline showing root filesystem optimization, kernel module integration, root filesystem image creation, firmware collection, flash folder creation and release metadata generation.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>

    <linearGradient id="optimize" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="modules" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="rootfs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="firmware" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="release" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>

    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .step-title { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .step-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
      .step-file { font: 600 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: rgba(255,255,255,.95); }
      .number { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="560" rx="30" fill="url(#bg)"/>

  <text x="700" y="58" text-anchor="middle" class="title">Build Pipeline Quick Reference</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">The six automated stages executed by scripts/build-all.sh</text>

  <!-- Step numbers -->
  <g>
    <circle cx="135" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="135" y="148" text-anchor="middle" class="number">1</text>

    <circle cx="365" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="365" y="148" text-anchor="middle" class="number">2</text>

    <circle cx="595" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="595" y="148" text-anchor="middle" class="number">3</text>

    <circle cx="825" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="825" y="148" text-anchor="middle" class="number">4</text>

    <circle cx="1055" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1055" y="148" text-anchor="middle" class="number">5</text>

    <circle cx="1285" cy="142" r="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1285" y="148" text-anchor="middle" class="number">6</text>
  </g>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="45" y="180" width="180" height="165" rx="22" fill="url(#optimize)"/>
    <text x="135" y="220" text-anchor="middle" class="step-title">Optimize RootFS</text>
    <text x="135" y="252" text-anchor="middle" class="step-file">optimize-rootfs.sh</text>
    <text x="135" y="282" text-anchor="middle" class="step-sub">Disable timers</text>
    <text x="135" y="307" text-anchor="middle" class="step-sub">Tune memory and logs</text>
  </g>

  <path d="M225 262 H275" class="connector"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="275" y="180" width="180" height="165" rx="22" fill="url(#modules)"/>
    <text x="365" y="220" text-anchor="middle" class="step-title">Install Modules</text>
    <text x="365" y="252" text-anchor="middle" class="step-file">install-kernel-modules.sh</text>
    <text x="365" y="282" text-anchor="middle" class="step-sub">Copy *.ko files</text>
    <text x="365" y="307" text-anchor="middle" class="step-sub">Generate depmod data</text>
  </g>

  <path d="M455 262 H505" class="connector"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="505" y="180" width="180" height="165" rx="22" fill="url(#rootfs)"/>
    <text x="595" y="220" text-anchor="middle" class="step-title">Create RootFS</text>
    <text x="595" y="252" text-anchor="middle" class="step-file">create-rootfs-image.sh</text>
    <text x="595" y="282" text-anchor="middle" class="step-sub">Build ext4 image</text>
    <text x="595" y="307" text-anchor="middle" class="step-sub">Add swapfile</text>
  </g>

  <path d="M685 262 H735" class="connector"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="735" y="180" width="180" height="165" rx="22" fill="url(#firmware)"/>
    <text x="825" y="220" text-anchor="middle" class="step-title">Collect Firmware</text>
    <text x="825" y="252" text-anchor="middle" class="step-file">collect-firmware.sh</text>
    <text x="825" y="282" text-anchor="middle" class="step-sub">Merge SDK assets</text>
    <text x="825" y="307" text-anchor="middle" class="step-sub">Create firmware set</text>
  </g>

  <path d="M915 262 H965" class="connector"/>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="965" y="180" width="180" height="165" rx="22" fill="url(#flash)"/>
    <text x="1055" y="220" text-anchor="middle" class="step-title">Create Flash Folder</text>
    <text x="1055" y="252" text-anchor="middle" class="step-file">create-flash-folder.sh</text>
    <text x="1055" y="282" text-anchor="middle" class="step-sub">Build SDTool layout</text>
    <text x="1055" y="307" text-anchor="middle" class="step-sub">Copy required images</text>
  </g>

  <path d="M1145 262 H1195" class="connector"/>

  <!-- Step 6 -->
  <g filter="url(#shadow)">
    <rect x="1195" y="180" width="180" height="165" rx="22" fill="url(#release)"/>
    <text x="1285" y="220" text-anchor="middle" class="step-title">Create Metadata</text>
    <text x="1285" y="252" text-anchor="middle" class="step-file">create-release-metadata.sh</text>
    <text x="1285" y="282" text-anchor="middle" class="step-sub">manifest.txt</text>
    <text x="1285" y="307" text-anchor="middle" class="step-sub">SHA256SUMS + VERSION</text>
  </g>

  <!-- Outputs -->
  <g filter="url(#shadow)">
    <rect x="170" y="400" width="1060" height="80" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="215" y="432" class="note">Final output:</text>
    <text x="215" y="459" class="mono">output/release/ → boot.img · rootfs.img · userdata.img · env.img · manifest.txt · SHA256SUMS</text>
  </g>

  <text x="700" y="520" text-anchor="middle" class="note">Each stage can also be executed independently during development or troubleshooting.</text>
</svg>