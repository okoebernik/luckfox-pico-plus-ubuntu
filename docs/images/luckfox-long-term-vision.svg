<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-soft { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="center" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
</defs>
<rect width="1500" height="820" rx="30" fill="url(#bg)"/>
<text id="title" x="750" y="58" text-anchor="middle" class="title">Long-Term Vision</text>
<text id="desc" x="750" y="88" text-anchor="middle" class="subtitle">A reliable, transparent and maintainable Ubuntu platform for the Luckfox Pico Plus</text>

<path d="M750 390 L315 235" class="connector-soft"/>
<path d="M750 390 L1185 235" class="connector-soft"/>
<path d="M750 390 L265 510" class="connector-soft"/>
<path d="M750 390 L1235 510" class="connector-soft"/>
<path d="M750 390 L505 680" class="connector-soft"/>
<path d="M750 390 L995 680" class="connector-soft"/>

<g filter="url(#shadow)">
  <circle cx="750" cy="390" r="135" fill="url(#center)"/>
  <text x="750" y="370" text-anchor="middle" class="box-title">Luckfox Ubuntu</text>
  <text x="750" y="402" text-anchor="middle" class="box-sub">Reliable embedded Linux</text>
  <text x="750" y="430" text-anchor="middle" class="box-sub">with familiar Ubuntu tools</text>
</g>

<g filter="url(#shadow)">
  <rect x="115" y="145" width="400" height="170" rx="24" fill="url(#g1)"/>
  <text x="315" y="192" text-anchor="middle" class="box-title">Reproducible Builds</text>
  <text x="315" y="230" text-anchor="middle" class="box-sub">Documented inputs · verified outputs</text>
  <text x="315" y="260" text-anchor="middle" class="box-sub">Traceable source and artifacts</text>
</g>

<g filter="url(#shadow)">
  <rect x="985" y="145" width="400" height="170" rx="24" fill="url(#g2)"/>
  <text x="1185" y="192" text-anchor="middle" class="box-title">Excellent Documentation</text>
  <text x="1185" y="230" text-anchor="middle" class="box-sub">Guides · diagrams · recovery</text>
  <text x="1185" y="260" text-anchor="middle" class="box-sub">Accessible to users and developers</text>
</g>

<g filter="url(#shadow)">
  <rect x="65" y="425" width="400" height="170" rx="24" fill="url(#g3)"/>
  <text x="265" y="472" text-anchor="middle" class="box-title">Hardware Validation</text>
  <text x="265" y="510" text-anchor="middle" class="box-sub">Boot · memory · storage · network</text>
  <text x="265" y="540" text-anchor="middle" class="box-sub">Evidence for every supported feature</text>
</g>

<g filter="url(#shadow)">
  <rect x="1035" y="425" width="400" height="170" rx="24" fill="url(#g4)"/>
  <text x="1235" y="472" text-anchor="middle" class="box-title">Developer Experience</text>
  <text x="1235" y="510" text-anchor="middle" class="box-sub">Clear tooling and workflows</text>
  <text x="1235" y="540" text-anchor="middle" class="box-sub">Fast diagnosis and recovery</text>
</g>

<g filter="url(#shadow)">
  <rect x="305" y="650" width="400" height="120" rx="24" fill="url(#g5)"/>
  <text x="505" y="697" text-anchor="middle" class="box-title">Stable Releases</text>
  <text x="505" y="735" text-anchor="middle" class="box-sub">Known-good images and checksums</text>
</g>

<g filter="url(#shadow)">
  <rect x="795" y="650" width="400" height="120" rx="24" fill="url(#g6)"/>
  <text x="995" y="697" text-anchor="middle" class="box-title">Community Contribution</text>
  <text x="995" y="735" text-anchor="middle" class="box-sub">Transparent priorities and review</text>
</g>
</svg>