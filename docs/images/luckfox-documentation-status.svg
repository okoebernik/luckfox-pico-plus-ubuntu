<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
 <linearGradient id="complete" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
 <linearGradient id="progress" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
</defs>
<rect width="1400" height="580" rx="30" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">Documentation Status</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Core user and engineering guides are available</text>

<g filter="url(#shadow)">

 <rect x="-35" y="150" width="220" height="115" rx="22" fill="url(#complete)"/>
 <text x="75" y="193" text-anchor="middle" class="box-title">README</text>
 <text x="75" y="228" text-anchor="middle" class="box-sub">Complete</text>

 <rect x="240" y="150" width="220" height="115" rx="22" fill="url(#complete)"/>
 <text x="350" y="193" text-anchor="middle" class="box-title">Introduction</text>
 <text x="350" y="228" text-anchor="middle" class="box-sub">Complete</text>

 <rect x="515" y="150" width="220" height="115" rx="22" fill="url(#complete)"/>
 <text x="625" y="193" text-anchor="middle" class="box-title">Getting Started</text>
 <text x="625" y="228" text-anchor="middle" class="box-sub">Complete</text>

 <rect x="790" y="150" width="220" height="115" rx="22" fill="url(#complete)"/>
 <text x="900" y="193" text-anchor="middle" class="box-title">Build System</text>
 <text x="900" y="228" text-anchor="middle" class="box-sub">Complete</text>

 <rect x="1065" y="150" width="220" height="115" rx="22" fill="url(#complete)"/>
 <text x="1175" y="193" text-anchor="middle" class="box-title">Flashing</text>
 <text x="1175" y="228" text-anchor="middle" class="box-sub">Complete</text>

 <rect x="100" y="330" width="220" height="115" rx="22" fill="url(#complete)"/>
 <text x="210" y="373" text-anchor="middle" class="box-title">First Boot</text>
 <text x="210" y="408" text-anchor="middle" class="box-sub">Complete</text>

 <rect x="375" y="330" width="220" height="115" rx="22" fill="url(#complete)"/>
 <text x="485" y="373" text-anchor="middle" class="box-title">Memory Optimization</text>
 <text x="485" y="408" text-anchor="middle" class="box-sub">Complete</text>

 <rect x="650" y="330" width="220" height="115" rx="22" fill="url(#progress)"/>
 <text x="760" y="373" text-anchor="middle" class="box-title">Troubleshooting</text>
 <text x="760" y="408" text-anchor="middle" class="box-sub">In progress</text>

 <rect x="925" y="330" width="220" height="115" rx="22" fill="url(#progress)"/>
 <text x="1035" y="373" text-anchor="middle" class="box-title">Development</text>
 <text x="1035" y="408" text-anchor="middle" class="box-sub">In progress</text>
</g>
<text x="700" y="525" text-anchor="middle" class="note">Status reflects the current documentation set in this repository.</text>
</svg>