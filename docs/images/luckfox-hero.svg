<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
  </marker>
  <style>
    .title { font: 700 36px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
    .box-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
    .box-sub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(255,255,255,.92); }
    .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .note { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
  </style>
</defs>

<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#1e293b"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f97316"/>
    <stop offset="50%" stop-color="#ea580c"/>
    <stop offset="100%" stop-color="#2563eb"/>
  </linearGradient>
</defs>
<rect width="1400" height="520" rx="30" fill="url(#hero)"/>
<rect x="0" y="0" width="1400" height="12" fill="url(#accent)"/>
<circle cx="1160" cy="260" r="150" fill="none" stroke="#334155" stroke-width="3"/>
<circle cx="1160" cy="260" r="105" fill="none" stroke="#475569" stroke-width="3"/>
<circle cx="1160" cy="260" r="62" fill="#111827" stroke="#94a3b8" stroke-width="3"/>
<text x="1160" y="252" text-anchor="middle" style="font:700 22px Inter,Arial;fill:#fff;">RV1103</text>
<text x="1160" y="282" text-anchor="middle" style="font:500 14px Inter,Arial;fill:#cbd5e1;">ARMHF</text>

<text x="90" y="120" style="font:700 50px Inter,Arial;fill:#fff;">Ubuntu 22.04</text>
<text x="90" y="177" style="font:700 38px Inter,Arial;fill:#fb923c;">for Luckfox Pico Plus</text>
<text x="90" y="225" style="font:400 20px Inter,Arial;fill:#cbd5e1;">Reproducible · Automated · Low-memory optimized</text>

<g filter="url(#shadow)">
  <rect x="90" y="285" width="165" height="54" rx="16" fill="#f97316"/>
  <text x="172" y="319" text-anchor="middle" style="font:700 15px Inter,Arial;fill:#fff;">Ubuntu 22.04</text>
  <rect x="275" y="285" width="150" height="54" rx="16" fill="#2563eb"/>
  <text x="350" y="319" text-anchor="middle" style="font:700 15px Inter,Arial;fill:#fff;">Linux 5.10.160</text>
  <rect x="445" y="285" width="120" height="54" rx="16" fill="#059669"/>
  <text x="505" y="319" text-anchor="middle" style="font:700 15px Inter,Arial;fill:#fff;">Ethernet</text>
  <rect x="585" y="285" width="100" height="54" rx="16" fill="#7c3aed"/>
  <text x="635" y="319" text-anchor="middle" style="font:700 15px Inter,Arial;fill:#fff;">SSH</text>
</g>

<text x="90" y="405" style="font:600 15px ui-monospace,Consolas;fill:#e2e8f0;">Official Luckfox SDK + Ubuntu ARMHF userspace</text>
<text x="90" y="440" style="font:400 15px Inter,Arial;fill:#94a3b8;">Bootloader · Kernel · Device Tree · Drivers · apt · systemd · OpenSSH</text>
